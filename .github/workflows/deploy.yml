# Пуш в main → выкладка API на сервер Yapp (Timeweb), рядом с Yapp и «Детьми Марии».
# Образ собирается здесь и едет на сервер по ssh; Caddy от Yapp выдаёт HTTPS и проксирует на наш контейнер.
# Адрес: https://kod.<ip-через-дефисы>.sslip.io (или DOMAIN). Фронт на Vercel: ?api=<этот адрес>.
#
# Repo variables:  DEPLOY_HOST  — IP сервера (без него деплой пропускается)
#                  DOMAIN       — свой домен (необязательно)
#                  SHEET_SINCE  — отсечка ответов с репетиции, напр. 2026-11-26T11:20:27 (нужна на первом запуске)
#                  LLM_PROVIDER — auto (по умолчанию) | yandex | claude | offline
# Secrets:         SSH_KEY — приватный ключ, открытая часть в /home/deploy/.ssh/authorized_keys на сервере
#                  SSH_KNOWN_HOSTS — отпечаток сервера (необязательно: без него берётся ssh-keyscan)
#                  WEBHOOK_SECRET, SHEET_CSV_INTERN, SHEET_CSV_MENTOR, YC_API_KEY, YC_FOLDER_ID — как в .env, все необязательные
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ['docs/presentation/**', '*.md', 'tests/**']
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ vars.DEPLOY_HOST != '' }}
    runs-on: ubuntu-latest
    env:
      HOST: ${{ vars.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: SSH-доступ
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            # секрета нет — берём отпечаток с сервера; сверить с `ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub` на сервере
            ssh-keyscan -t ed25519 "$HOST" > ~/.ssh/known_hosts
          fi
          ssh-keygen -lf ~/.ssh/known_hosts

      - name: Конфиг сервера
        env:
          DOMAIN: ${{ vars.DOMAIN }}
          SHEET_SINCE: ${{ vars.SHEET_SINCE }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          SHEET_CSV_INTERN: ${{ secrets.SHEET_CSV_INTERN }}
          SHEET_CSV_MENTOR: ${{ secrets.SHEET_CSV_MENTOR }}
          YC_API_KEY: ${{ secrets.YC_API_KEY }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          umask 077
          domain="${DOMAIN:-kod.${HOST//./-}.sslip.io}"
          echo "DOMAIN=$domain" >> "$GITHUB_ENV"
          {
            echo "LLM_PROVIDER=${LLM_PROVIDER:-auto}"
            echo "POLL_SECONDS=5"
            for name in SHEET_SINCE WEBHOOK_SECRET SHEET_CSV_INTERN SHEET_CSV_MENTOR YC_API_KEY YC_FOLDER_ID; do
              if [ -n "${!name}" ]; then printf '%s=%s\n' "$name" "${!name}"; fi
            done
          } > deploy/.env
          # имена (не значения!) — чтобы в логе было видно, что подхватилось
          echo "В .env на сервере: $(cut -d= -f1 deploy/.env | tr '\n' ' ')"
          sed "s/__DOMAIN__/$domain/" deploy/kod.caddy > deploy/kod.caddy.out

      - uses: docker/setup-buildx-action@v3
      - name: Образ API
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: kod-goroda-api:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Образ и конфиг на сервер
        run: |
          ssh deploy@"$HOST" "df -h / | tail -1 && test -d /opt/yapp/sites" \
            || { echo "На сервере нет /opt/yapp/sites — Caddy Yapp не подключает соседние сайты" >&2; exit 1; }
          docker save kod-goroda-api:latest | gzip -1 | ssh deploy@"$HOST" "gunzip | docker load"
          ssh deploy@"$HOST" "mkdir -p ~/kod-goroda/state"
          scp deploy/docker-compose.prod.yml deploy@"$HOST":kod-goroda/docker-compose.yml
          scp deploy/.env deploy@"$HOST":kod-goroda/.env
          ssh deploy@"$HOST" "chmod 600 ~/kod-goroda/.env"

      - name: Выкладка
        run: |
          ssh deploy@"$HOST" "cd ~/kod-goroda && docker compose up -d --remove-orphans && docker image prune -f"
          scp deploy/kod.caddy.out deploy@"$HOST":/opt/yapp/sites/kod.caddy
          # Если наш конфиг не примется, Caddy оставит прежний — Yapp не пострадает; файл убираем сразу,
          # иначе с ним не поднимется Caddy при следующем перезапуске Yapp.
          ssh deploy@"$HOST" "docker exec yapp-caddy-1 caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile \
            || { rm -f /opt/yapp/sites/kod.caddy; exit 1; }"

      - name: Проверка
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://$DOMAIN/health"; then echo; echo "https://$DOMAIN работает"; exit 0; fi
            sleep 5
          done
          ssh deploy@"$HOST" "cd ~/kod-goroda && docker compose ps && docker compose logs --tail=60 && free -m && df -h /"
          exit 1
