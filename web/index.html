<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Радар стажировки · МГТС</title>
<link rel="icon" href="brand/logos/logo1.png">
<link rel="stylesheet" href="brand/brand.css">
<script src="vendor/chart.umd.min.js"></script>
<script src="config.js" onerror=""></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--mgts-bg-soft);font-size:15px;line-height:1.45}
button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--mgts-line)}
.top-in{max-width:1440px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.brand img{height:40px}
.brand h1{margin:0;font-size:22px;line-height:1}
.brand small{display:block;font-family:var(--font-text);font-weight:400;font-size:13px;color:var(--mgts-muted);margin-top:4px}
.periods{display:flex;gap:4px;background:var(--mgts-bg-soft);padding:4px;border-radius:12px;margin-left:auto}
.periods button{border:0;background:none;padding:7px 12px;border-radius:9px;color:var(--mgts-navy);font-weight:500;font-size:14px}
.periods button.on{background:var(--mgts-blue);color:#fff}
.periods .lab{align-self:center;color:var(--mgts-muted);font-size:13px;padding:0 6px}
.live{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mgts-muted)}
.live i{width:9px;height:9px;border-radius:50%;background:var(--st-green);box-shadow:0 0 0 0 rgba(43,174,102,.6);animation:pulse 2s infinite}
.live.off i{background:var(--mgts-muted);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(43,174,102,0)}100%{box-shadow:0 0 0 0 rgba(43,174,102,0)}}
main{max-width:1440px;margin:0 auto;padding:24px 28px 60px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:22px}
.kpi{background:#fff;border-radius:18px;padding:18px 22px}
.kpi .v{font-family:var(--font-title);font-weight:500;font-size:34px;line-height:1.1;color:var(--mgts-navy)}
.kpi .l{font-size:13px;color:var(--mgts-muted)}
.kpi.red .v{color:var(--st-red)}.kpi.yellow .v{color:#C98100}.kpi.green .v{color:var(--st-green)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.panel{background:#fff;border-radius:20px;padding:22px 24px;margin-bottom:22px}
.panel h2{font-size:20px;margin:0 0 14px;display:flex;align-items:center;gap:10px}
.panel h2 .hint{font-family:var(--font-text);font-weight:400;font-size:13px;color:var(--mgts-muted);margin-left:auto}
.mut{color:var(--mgts-muted)}
/* светофор */
.who{display:flex;flex-direction:column;gap:10px}
.icard{display:grid;grid-template-columns:14px 1fr auto;gap:12px;align-items:center;text-align:left;border:2px solid transparent;
  background:var(--mgts-bg-soft);border-radius:16px;padding:14px 16px;color:var(--mgts-navy);transition:.15s}
.icard:hover{border-color:var(--mgts-blue-soft)}
.icard.sel{border-color:var(--mgts-blue);background:#fff}
.icard.flash{animation:flash 1.6s 3}
@keyframes flash{50%{background:#FFE7E0}}
.icard b{font-family:var(--font-title);font-weight:700;font-size:16px}
.icard .why{font-size:13px;color:var(--mgts-muted);margin-top:2px}
.icard .sc{font-family:var(--font-title);font-weight:500;font-size:15px;text-align:right;white-space:nowrap}
.icard .sc small{display:block;font-family:var(--font-text);font-weight:400;font-size:11px;color:var(--mgts-muted)}
.dot{width:14px;height:14px;border-radius:50%}
.st-red{background:var(--st-red)}.st-yellow{background:var(--st-yellow)}.st-green{background:var(--st-green)}.st-grey{background:#C5D3E2}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:30px;padding:3px 12px;font-size:13px;font-weight:500}
.b-red{background:#FDE7E8;color:#B4232A}.b-yellow{background:#FFF2D9;color:#8A5A00}.b-green{background:#E2F6EB;color:#1C7A47}.b-blue{background:#E3F2FC;color:var(--mgts-blue)}.b-grey{background:#EEF2F6;color:var(--mgts-muted)}
/* матрица */
table{border-collapse:collapse;width:100%}
.mx th,.mx td{padding:7px 6px;text-align:center;font-size:13px;border-bottom:1px solid var(--mgts-line)}
.mx th{color:var(--mgts-muted);font-weight:500}
.mx td:first-child,.mx th:first-child{text-align:left}
.cell{display:inline-flex;gap:3px}
.cell span{width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.ok{background:#E2F6EB;color:#1C7A47}.miss{background:#FDE7E8;color:#B4232A}.wait{background:#EEF2F6;color:var(--mgts-muted)}
.mx .cur{background:#F5FAFE}
/* темы, лента */
.theme{border-radius:14px;background:#FFF4F0;padding:14px 16px;margin-bottom:10px}
.theme b{color:var(--mgts-navy)}
.theme q{display:block;color:var(--mgts-muted);font-size:13px;margin-top:6px}
.feed{max-height:220px;overflow:auto;font-size:13px}
.feed div{padding:7px 0;border-bottom:1px solid var(--mgts-line)}
.feed time{color:var(--mgts-muted);margin-right:8px;font-variant-numeric:tabular-nums}
/* карточка */
.chead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.chead h2{font-size:30px;margin:0}
.chead .meta{color:var(--mgts-muted);font-size:14px;margin-top:4px}
.summary{background:var(--mgts-bg-soft);border-radius:16px;padding:16px 18px;margin:16px 0}
.summary ul{margin:8px 0 0;padding-left:20px}
.tabs{display:flex;gap:6px;margin:4px 0 10px;flex-wrap:wrap}
.tabs button{border:1px solid var(--mgts-line);background:#fff;border-radius:20px;padding:5px 14px;font-size:13px;color:var(--mgts-navy)}
.tabs button.on{background:var(--mgts-navy);border-color:var(--mgts-navy);color:#fff}
.chartbox{height:320px;position:relative}
.sig{border:1px solid var(--mgts-line);border-radius:16px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:.15s}
.sig:hover,.sig.on{border-color:var(--mgts-blue);box-shadow:0 4px 18px rgba(0,138,224,.12)}
.sig .t{display:flex;gap:10px;align-items:center;font-weight:700}
.sig .w{margin:6px 0 8px;font-size:14px}
.ev{display:flex;flex-wrap:wrap;gap:6px}
.ev span{background:var(--mgts-bg-soft);border-radius:8px;padding:3px 9px;font-size:12.5px}
.ev q{font-style:italic}
.rev{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.rev button{border:1px solid var(--mgts-line);background:#fff;border-radius:10px;padding:4px 10px;font-size:12.5px;color:var(--mgts-navy)}
.rev button.on.c{background:var(--st-green);border-color:var(--st-green);color:#fff}
.rev button.on.f{background:var(--mgts-muted);border-color:var(--mgts-muted);color:#fff}
.rev button.on.w{background:var(--mgts-blue);border-color:var(--mgts-blue);color:#fff}
.pairs td,.pairs th{padding:6px 6px;font-size:13px;border-bottom:1px solid var(--mgts-line);text-align:center}
.pairs td:first-child,.pairs th:first-child{text-align:left}
.gap2{background:#FDE7E8;border-radius:6px}.gap1{background:#FFF2D9;border-radius:6px}
.cm{display:grid;grid-template-columns:130px 1fr 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--mgts-line);font-size:13.5px}
.cm.hl{background:#FFF4F0;border-radius:10px}
.cm .p{font-family:var(--font-title);font-weight:500;color:var(--mgts-blue)}
.cm h4{margin:0 0 3px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mgts-muted);font-weight:500}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:28px}
.toast{position:fixed;right:24px;bottom:96px;z-index:50;background:var(--mgts-navy);color:#fff;border-radius:16px;padding:16px 20px;
  max-width:420px;box-shadow:0 10px 30px rgba(16,44,81,.35);transform:translateY(30px);opacity:0;pointer-events:none;transition:.35s}
.toast.show{transform:none;opacity:1}
.toast b{color:#fff}
.note{font-size:12px;color:var(--mgts-muted)}
.mockbar{background:var(--mgts-orange);color:#fff;text-align:center;font-size:13px;padding:4px}

/* чат «Спросить Радар» */
.askbtn{position:fixed;right:24px;bottom:24px;z-index:40;display:flex;align-items:center;gap:10px;border:0;border-radius:30px;
  background:var(--mgts-blue);color:#fff;padding:14px 22px 14px 16px;font-weight:500;box-shadow:0 10px 30px rgba(0,138,224,.35);transition:transform .15s}
.askbtn:hover{transform:translateY(-2px)}
.askbtn img{width:28px;height:28px;border-radius:8px;background:#fff;padding:3px}
.chat{position:fixed;right:24px;bottom:24px;z-index:45;width:420px;max-width:calc(100vw - 32px);height:600px;max-height:calc(100vh - 110px);
  background:#fff;border-radius:24px;box-shadow:0 20px 60px rgba(16,44,81,.28);display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(20px) scale(.98);opacity:0;pointer-events:none;transition:.22s}
.chat.open{transform:none;opacity:1;pointer-events:auto}
.chat header{display:flex;align-items:center;gap:12px;padding:16px 18px;background:var(--mgts-blue);color:#fff}
.chat header b{font-family:var(--font-title);font-weight:700;font-size:17px}
.chat header small{display:block;opacity:.8;font-size:12px}
.chat header button{margin-left:auto;border:0;background:rgba(255,255,255,.18);color:#fff;width:32px;height:32px;border-radius:10px;font-size:18px}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--mgts-bg-soft)}
.msg{max-width:88%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.45;animation:pop .18s ease-out}
.msg.me{align-self:flex-end;background:var(--mgts-blue);color:#fff;border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:#fff;color:var(--mgts-navy);border-bottom-left-radius:6px;box-shadow:0 1px 2px rgba(16,44,81,.06)}
.msg.bot ul{margin:6px 0 0;padding-left:18px}.msg.bot li{margin:3px 0}
.msg a{color:var(--mgts-blue);cursor:pointer;font-weight:500;text-decoration:none;border-bottom:1px dashed}
.typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--mgts-muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}@keyframes pop{from{transform:translateY(6px);opacity:0}}
.sugg{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px 0;background:#fff}
.sugg button{border:1px solid var(--mgts-line);background:#fff;border-radius:16px;padding:5px 11px;font-size:12.5px;color:var(--mgts-navy)}
.sugg button:hover{border-color:var(--mgts-blue);color:var(--mgts-blue)}
.chat form{display:flex;gap:8px;padding:12px 14px 14px;background:#fff}
.chat input{flex:1;border:1px solid var(--mgts-line);border-radius:14px;padding:11px 14px;font:inherit;color:var(--mgts-navy);outline:none}
.chat input:focus{border-color:var(--mgts-blue)}
.chat form button{border:0;background:var(--mgts-blue);color:#fff;border-radius:14px;width:46px;font-size:18px}

/* --- живой слой: тени, движение, шиммер (приёмы из Yapp и МиоТренера) --- */
:root{--sh:0 1px 2px rgba(19,64,116,.06),0 12px 32px -10px rgba(0,138,224,.16);--sh-h:0 2px 4px rgba(19,64,116,.08),0 18px 40px -10px rgba(0,138,224,.26);--ease:cubic-bezier(.2,0,0,1)}
.top{background:rgba(255,255,255,.78);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px)}
.panel,.kpi{border-radius:22px;box-shadow:var(--sh)}
.kpi{transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--sh-h)}
button:active{transform:scale(.97)}
.icard{transition:transform .25s var(--ease),border-color .2s,background .2s,box-shadow .25s}
.icard:hover{transform:translateX(3px);box-shadow:var(--sh)}
.rise>*{animation:rise .5s var(--ease) both}
.rise>*:nth-child(2){animation-delay:.05s}.rise>*:nth-child(3){animation-delay:.1s}.rise>*:nth-child(4){animation-delay:.15s}.rise>*:nth-child(5){animation-delay:.2s}.rise>*:nth-child(6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.shimmer{border-radius:14px;background:linear-gradient(90deg,#EEF4FA 25%,#F7FAFD 50%,#EEF4FA 75%);background-size:200% 100%;animation:sh 1.6s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.live i{animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{50%{opacity:.35;transform:scale(.85)}}
.trend{font-size:12px;font-weight:700;margin-left:6px}.trend.up{color:var(--st-green)}.trend.down{color:var(--st-red)}
/* приветственная полоса */
.hero{position:relative;overflow:hidden;border-radius:26px;background:linear-gradient(115deg,#008AE0 0%,#0A6FC2 55%,#134074 100%);color:#fff;
  padding:28px 34px;margin-bottom:22px;min-height:150px;box-shadow:var(--sh)}
.hero h2{font-family:var(--font-title);font-weight:900;font-size:30px;line-height:1.15;color:#fff;margin:0 0 8px;max-width:760px}
.hero p{margin:0;opacity:.9;font-size:16px;max-width:680px}
.hero .cta{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.hero .cta button{border:0;border-radius:999px;padding:9px 18px;font-weight:500;background:#fff;color:var(--mgts-navy)}
.hero .cta button.ghost{background:rgba(255,255,255,.16);color:#fff}
.hero img{position:absolute;right:-10px;top:-40px;height:250px;pointer-events:none;animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(10px) rotate(2deg)}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
@media (max-width:800px){.hero img{opacity:.25}}
@media (max-width:1100px){.grid2,.two{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body>
<div id="mockbar" class="mockbar" hidden></div>
<header class="top"><div class="top-in">
  <div class="brand"><img src="brand/logos/logo1.svg" alt="МГТС">
    <h1>Радар стажировки<small>МГТС · HR</small></h1></div>
  <div class="periods" id="periods"></div>
  <div class="live" id="live"><i></i><span>подключение…</span></div>
</div></header>

<main class="rise">
  <section class="hero" id="hero"><img src="brand/img/cube.png" alt=""><h2>Загрузка…</h2></section>
  <section class="kpis" id="kpis"><div class="kpi shimmer" style="height:96px"></div><div class="kpi shimmer" style="height:96px"></div><div class="kpi shimmer" style="height:96px"></div><div class="kpi shimmer" style="height:96px"></div><div class="kpi shimmer" style="height:96px"></div></section>
  <div class="grid2">
    <section class="panel"><h2>Стажёры</h2><div class="who" id="who"></div></section>
    <div>
      <section class="panel"><h2>Анкеты <span class="hint">стажёр · наставник</span></h2><div id="matrix"></div></section>
      <section class="panel"><h2>Новые ответы</h2><div class="feed" id="feed"><div class="mut">ждём ответы из форм</div></div></section>
    </div>
  </div>
  <section class="panel" id="themesBox" hidden><h2>Повторяющиеся проблемы</h2><div id="themes" class="themes"></div></section>
  <section class="panel" id="card"><div class="mut">Выберите стажёра</div></section>
</main>
<div class="toast" id="toast"></div>
<button class="askbtn" id="askbtn"><img src="brand/logos/logo1.png" alt="">Спросить Радар</button>
<section class="chat" id="chat" aria-label="Чат с ассистентом HR">
  <header><div><b>Радар</b><small>ассистент HR по стажёрам</small></div><button id="chatx" aria-label="Закрыть">×</button></header>
  <div class="msgs" id="msgs"></div>
  <div class="sugg" id="sugg"></div>
  <form id="chatf"><input id="chatq" placeholder="Например: почему СТ-004 красный?" autocomplete="off"><button aria-label="Отправить">↑</button></form>
</section>


<script>
const S = {ov:null, period:null, sel:null, card:null, ver:null, mock:null, chart:null, mode:'avg', focus:null,
           onlyConfirmed:false, feed:[]};
const qs = new URLSearchParams(location.search);
// адрес бэка: ?api=https://…  (запоминается) → window.RADAR_API из config.js → тот же сервер
const API = (() => { let a = qs.get('api'); try { if(a) localStorage.setItem('radar.api', a); else a = localStorage.getItem('radar.api'); } catch {}
  return (a || window.RADAR_API || '').replace(/\/$/, ''); })();
const STATIC_HOST = /vercel\.app$|netlify\.app$|github\.io$/.test(location.hostname) && !API;
const MOCKS = [2,3,4,6];
const ST = {red:'Критично', yellow:'Внимание', green:'Положительно', grey:'Нет данных'};
const ORDER = {red:0, yellow:1, grey:2, green:3};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = v => v == null ? '—' : String(v).replace('.', ',');
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// ---------- данные: API, при недоступности — моки ----------
async function getJSON(url){ const r = await fetch(url, {cache:'no-store'}); if(!r.ok) throw new Error(r.status); return r.json(); }
function mockDir(p){ const want = p || 6; return 'mock/p' + (MOCKS.filter(m => m <= want).pop() || MOCKS[0]); }
async function loadOverview(){
  if(S.mock) return getJSON(`${mockDir(S.period)}/overview.json`);
  try { return await getJSON(API + '/api/overview' + (S.period ? `?period=${S.period}` : '')); }
  catch(e){ S.mock = 'auto'; banner(); return getJSON(`${mockDir(S.period)}/overview.json`); }
}
async function loadIntern(id){
  if(S.mock) return getJSON(`${mockDir(S.period)}/intern_${id}.json`);
  return getJSON(API + `/api/interns/${encodeURIComponent(id)}` + (S.period ? `?period=${S.period}` : ''));
}
function banner(){ const b = $('mockbar'); b.hidden = !S.mock;
  b.textContent = S.mock === 'auto' ? 'Нет связи с сервером — показаны сохранённые данные' : `Демо-данные · Месяц ${S.period || 6}`; }

// ---------- решения HR по сигналам ----------
const RKEY = 'radar.reviews';
function reviews(){ try { return JSON.parse(localStorage.getItem(RKEY) || '{}'); } catch { return {}; } }
function reviewOf(sig){ return sig.review?.status || reviews()[sig.id] || null; }
async function setReview(id, status){
  const all = reviews(); all[id] = all[id] === status ? null : status;
  try { localStorage.setItem(RKEY, JSON.stringify(all)); } catch {}
  if(!S.mock) fetch(API + `/api/signals/${encodeURIComponent(id)}/review`, {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({status: all[id] || 'none'})}).catch(()=>{});
  renderCard();
}

// ---------- обзор ----------
function renderPeriods(){
  const ps = S.ov.periods || [];
  const cur = S.period || S.ov.current_period;
  $('periods').innerHTML = '<span class="lab">Срез на</span>' + ps.map(p =>
    `<button class="${p===cur?'on':''}" data-p="${p}">Месяц ${p}</button>`).join('');
  $('periods').querySelectorAll('button').forEach(b => b.onclick = () => {
    const p = +b.dataset.p; S.period = (p === Math.max(...ps) && !S.mock) ? null : p; refresh();
  });
}
function renderKpis(){
  const k = S.ov.kpi || {}, cur = S.period || S.ov.current_period;
  $('kpis').innerHTML = `
    <div class="kpi"><div class="v">${esc(k.responded_interns)}</div><div class="l">стажёры · Месяц ${cur}</div></div>
    <div class="kpi"><div class="v">${esc(k.responded_mentors)}</div><div class="l">наставники · Месяц ${cur}</div></div>
    <div class="kpi red"><div class="v" data-n="${k.red ?? 0}">0</div><div class="l">критично</div></div>
    <div class="kpi yellow"><div class="v" data-n="${k.yellow ?? 0}">0</div><div class="l">внимание</div></div>
    <div class="kpi green"><div class="v" data-n="${k.green ?? 0}">0</div><div class="l">положительно</div></div>`;
  $('kpis').querySelectorAll('[data-n]').forEach(countUp);
}
function renderWho(flashId){
  const list = [...(S.ov.interns || [])].sort((a,b) => (ORDER[a.status]??9) - (ORDER[b.status]??9) || (b.signals||0) - (a.signals||0));
  $('who').innerHTML = list.map(i => `
    <button class="icard ${i.intern_id===S.sel?'sel':''} ${i.intern_id===flashId?'flash':''}" data-id="${esc(i.intern_id)}">
      <span class="dot st-${i.status||'grey'}" title="${ST[i.status]||''}"></span>

function short(s){ return String(s).split(' ')[0]; }
function sigHtml(s){

  const ev = (s.evidence||[]).slice(0,8).map(e => e.quote
      ? `<span>М${e.period} · ${esc(e.source)}: <q>«${esc(e.quote)}»</q></span>`

function commentRow(p, hl){
  const block = (who, obj) => Object.entries(obj||{}).filter(([,v]) => v && v !== 'nan').map(([k,v]) => `<div style="margin-bottom:6px"><h4>${who}: ${esc(k)}</h4>${esc(v)}</div>`).join('');
  const a = p.comment_analysis || {};
  return `<div class="cm ${hl?'hl':''}"><div class="p">М${p.period}
      <div class="chips">${a.risk ? '<span class="badge b-red">риск</span>' : ''}${a.tone && a.tone!=='—' ? `<span class="badge b-grey">${esc(a.tone)}</span>` : ''}</div></div>
    <div>${block('стажёр', p.comments?.intern) || '<span class="mut">нет анкеты</span>'}
      <div class="chips">${(a.topics||[]).map(t => `<span class="badge b-blue">${esc(t)}</span>`).join('')}</div></div>

function drawChart(){
  const c = S.card, P = c.periods || [], labels = P.map(p => 'М' + p.period);
  let a, b, la = 'Стажёр', lb = 'Наставник', yMin = 1, yMax = 5, note = '';
  if(S.mode === 'norm'){
    const base = (k) => { const v = P.slice(0, 3).map(p => p[k]).filter(x => x != null); return v.length ? v.reduce((s,x)=>s+x,0)/v.length : null; };
    const bi = base('intern_avg'), bm = base('mentor_avg');
    a = P.map(p => p.intern_avg != null && bi != null ? +(p.intern_avg - bi).toFixed(2) : null);
    b = P.map(p => p.mentor_avg != null && bm != null ? +(p.mentor_avg - bm).toFixed(2) : null);
    yMin = -2.5; yMax = 2.5; note = 'Отклонение от личной нормы: у каждого своя шкала оценок.';
  } else if(S.mode.startsWith('pair')){
    const pr = c.pairs[+S.mode.slice(4)]; a = pr.by_period.map(x => x[0]); b = pr.by_period.map(x => x[1]);
    la = pr.intern; lb = pr.mentor; note = `${pr.intern} ↔ ${pr.mentor}`;
  } else { a = P.map(p => p.intern_avg); b = P.map(p => p.mentor_avg); }
  const fp = new Set((S.focus?.evidence || []).map(e => e.period));
  const rad = P.map(p => fp.has(p.period) ? 9 : 4), col = P.map(p => fp.has(p.period) ? css('--mgts-orange') : null);
  $('chnote').textContent = note;
  if(S.chart) S.chart.destroy();
  if(!window.Chart) { $('chnote').textContent = 'Chart.js не загрузился'; return; }
  S.chart = new Chart($('ch'), {type:'line', data:{labels, datasets:[
    {label:la, data:a, borderColor:css('--mgts-blue'), backgroundColor:col.map(x => x || css('--mgts-blue')), pointRadius:rad, borderWidth:3, tension:.3, spanGaps:true},
    {label:lb, data:b, borderColor:css('--mgts-navy'), backgroundColor:col.map(x => x || css('--mgts-navy')), pointRadius:rad, borderWidth:2, borderDash:[6,4], tension:.3, spanGaps:true},
  ]}, options:{responsive:true, maintainAspectRatio:false, animation:{duration:300},
    plugins:{legend:{position:'bottom', labels:{font:{family:'MTSText'}, color:css('--mgts-navy'), boxWidth:14}},
             tooltip:{callbacks:{label:x => `${x.dataset.label}: ${fmt(x.formattedValue)}`}}},
    scales:{y:{min:yMin, max:yMax, grid:{color:css('--mgts-line')}, ticks:{color:css('--mgts-muted')}},
            x:{grid:{display:false}, ticks:{color:css('--mgts-muted')}}}}});
}

function toast(html){ const t = $('toast'); t.innerHTML = html; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 6000); }
function setLive(ok, txt){ $('live').className = 'live' + (ok ? '' : ' off'); $('live').querySelector('span').textContent = txt; }
function renderFeed(){
  $('feed').innerHTML = S.feed.length ? S.feed.map(f => `<div><time>${esc(f.at)}</time><b>${esc(f.intern_id||'')}</b> · Месяц ${esc(f.period??'—')} · ${esc(f.what)}${f.change ? ` · <b>${f.change}</b>` : ''}</div>`).join('')
    : '<div class="mut">ждём ответы из форм</div>';
}
async function refresh(flashId){
  const prev = Object.fromEntries((S.ov?.interns || []).map(i => [i.intern_id, i.status]));
  S.ov = await loadOverview();
  renderPeriods(); renderHero(); renderKpis(); renderWho(flashId); renderMatrix(); renderThemes(); banner();
  if(!S.sel){ const first = [...S.ov.interns].sort((a,b) => (ORDER[a.status]??9)-(ORDER[b.status]??9))[0]; if(first) S.sel = first.intern_id; }
  if(S.sel){ S.card = await loadIntern(S.sel).catch(() => null); renderWho(flashId); renderCard(); }
  return prev;
}
async function poll(){
  if(S.mock){ setLive(false, 'демо-режим'); return; }
  try {
    const v = await getJSON(API + '/api/version');
    setLive(true, 'онлайн · ' + (v.last_event?.at || ''));
    if(S.ver != null && v.version !== S.ver){
      const e = v.last_event || {}, id = e.intern_id;
      const prev = await refresh(id);
      const now = (S.ov.interns || []).find(i => i.intern_id === id);
      const ch = now && prev[id] && prev[id] !== now.status ? `${ST[prev[id]]} → ${ST[now.status]}` : '';
      const what = e.source === 'mentor' || e.source === 'наставник' ? 'анкета наставника' : e.source === 'intern' || e.source === 'стажёр' ? 'анкета стажёра' : 'новый ответ';
      S.feed.unshift({at: e.at || new Date().toLocaleTimeString('ru', {hour:'2-digit', minute:'2-digit'}), intern_id:id, period:e.period, what: `${what}${e.via ? ' (' + e.via + ')' : ''}`, change: ch});
      S.feed = S.feed.slice(0, 30); renderFeed();
      if(id){ S.sel = id; S.card = await loadIntern(id); renderWho(id); renderCard(); }
      toast(`<b>Новый ответ: ${esc(id || '')} · Месяц ${esc(e.period ?? '')}</b>${ch ? `<br>${ch}` : ''}`);
    }
    S.ver = v.version;
  } catch(e){ setLive(false, 'нет связи с сервером'); }
}

// ---------- чат «Спросить Радар» ----------
// Отвечает по данным дашборда (работает и без бэка). Если у бэка есть POST /api/chat — спрашивает ИИ (YandexGPT).
const CHAT = {hist:[]};
const SUGG = ['Кто в зоне риска?', 'Почему СТ-004?', 'Кто не сдал анкету?', 'Что повторяется?', 'План на неделю'];
function chatOpen(v){ $('chat').classList.toggle('open', v); $('askbtn').style.display = v ? 'none' : ''; if(v){ if(!CHAT.hist.length) botSay(hello()); setTimeout(() => $('chatq').focus(), 200); } }
function hello(){ const r = (S.ov?.interns||[]).filter(i => i.status === 'red').length, y = (S.ov?.interns||[]).filter(i => i.status === 'yellow').length;
  return `Привет! Я знаю все анкеты стажёров и наставников. Сейчас: <b>${r}</b> критичн., <b>${y}</b> в зоне внимания. Что посмотрим?`; }
function addMsg(html, who){ const d = document.createElement('div'); d.className = 'msg ' + who; d.innerHTML = html; $('msgs').appendChild(d);
  $('msgs').scrollTop = 1e6; d.querySelectorAll('a[data-id]').forEach(a => a.onclick = () => { openIntern(a.dataset.id); $('card').scrollIntoView({behavior:'smooth'}); }); return d; }
function botSay(html){ CHAT.hist.push({role:'assistant', text:html.replace(/<[^>]+>/g,'')}); return addMsg(html, 'bot'); }
function renderSugg(){ $('sugg').innerHTML = SUGG.map(q => `<button type="button">${esc(q)}</button>`).join('');
  $('sugg').querySelectorAll('button').forEach(b => b.onclick = () => ask(b.textContent)); }
const link = id => `<a data-id="${esc(id)}">${esc(id)}</a>`;
async function cardOf(id){ try { return await loadIntern(id); } catch { return null; } }
async function localAnswer(q){
  const t = q.toLowerCase(), ov = S.ov || {}, list = ov.interns || [];
  const idm = q.toUpperCase().replace(/C/g,'С').replace(/T/g,'Т').match(/СТ-?\s?0*(\d+)/);
  const id = idm ? 'СТ-' + String(idm[1]).padStart(3, '0') : null;
  const cur = S.period || ov.current_period;
  if(id && /почему|что с|как дела|расскажи|сигнал|риск|красн|жёлт|желт/.test(t) || id && !/сдела|действ|встреч/.test(t) && !/наставник/.test(t)){
    const c = await cardOf(id); if(!c) return `Не нашёл ${esc(id)}.`;
    const sg = c.signals || [];
    if(!sg.length) return `${link(id)} (${esc(c.department)}): сигналов нет, динамика в норме. Средний балл ${fmt(c.periods?.at(-1)?.intern_avg)} у стажёра и ${fmt(c.periods?.at(-1)?.mentor_avg)} у наставника.`;
    return `${link(id)} · ${esc(c.department)} — <b>${ST[c.status]}</b>.<ul>${sg.slice(0,4).map(s => `<li><b>${esc(s.title)}</b>: ${esc(s.why)}${(s.evidence||[]).find(e=>e.quote) ? ` — «${esc((s.evidence||[]).find(e=>e.quote).quote)}»` : ''}</li>`).join('')}</ul>${c.actions?.length ? 'Что сделать: ' + c.actions.map(esc).join('; ') + '.' : ''}`;
  }
  if(id && /сдела|действ|встреч|помочь/.test(t)){ const c = await cardOf(id); return c?.actions?.length ? `По ${link(id)}:<ul>${c.actions.map(a => `<li>${esc(a)}</li>`).join('')}</ul>` : `По ${link(id)} действий не требуется.`; }
  if(id && /наставник|расхожд|разрыв/.test(t)){ const c = await cardOf(id); if(!c) return 'Не нашёл стажёра.';
    const g = (c.pairs||[]).map(p => { const l = p.by_period.filter(x => x[0]!=null && x[1]!=null).at(-1); return l ? {p, d:l[0]-l[1], l} : null; }).filter(Boolean).sort((a,b) => Math.abs(b.d)-Math.abs(a.d));
    return g.length ? `${link(id)}: самое большое расхождение — «${esc(g[0].p.intern)}» ${g[0].l[0]} у стажёра против ${g[0].l[1]} у наставника («${esc(g[0].p.mentor)}»).` : 'Нет данных для сравнения.'; }
  if(/не заполн|не ответ|пропуск|анкет/.test(t)){
    const miss = (ov.survey_status||[]).flatMap(r => { const c = (r.periods||{})[cur] || {}; const m = []; if(!c.intern) m.push(`${link(r.intern_id)} (стажёр)`); if(!c.mentor) m.push(`${esc(r.mentor_id)} — наставник ${link(r.intern_id)}`); return m; });
    return miss.length ? `За Месяц ${cur} нет анкет:<ul>${miss.map(m => `<li>${m}</li>`).join('')}</ul>Напомнить им — первое действие.` : `За Месяц ${cur} анкеты заполнили все: ${esc(ov.kpi?.responded_interns)} стажёров и ${esc(ov.kpi?.responded_mentors)} наставников.`; }
  if(/повтор|общ|програм|тем|чаще/.test(t)){
    if((ov.themes||[]).length) return `Повторяется:<ul>${ov.themes.map(x => `<li><b>${esc(x.topic)}</b> — у ${(x.interns||[]).map(link).join(', ')}</li>`).join('')}</ul>`;
    const cnt = {}; for(const i of list){ const c = await cardOf(i.intern_id); (c?.periods||[]).forEach(p => (p.comment_analysis?.topics||[]).forEach(tp => { (cnt[tp] ||= new Set()).add(i.intern_id); })); }
    const top = Object.entries(cnt).filter(([,v]) => v.size > 1).sort((a,b) => b[1].size - a[1].size).slice(0,4);
    return top.length ? `Чаще всего в комментариях:<ul>${top.map(([k,v]) => `<li><b>${esc(k)}</b> — у ${[...v].map(link).join(', ')}</li>`).join('')}</ul>` : 'Общих тем у нескольких стажёров не нашёл.'; }
  if(/недел|сделать|план|приорит|hr/.test(t)){
    const bad = list.filter(i => i.status !== 'green').sort((a,b) => ORDER[a.status]-ORDER[b.status]);
    if(!bad.length) return 'Все стажёры в норме. Достаточно планового месячного опроса.';
    const items = []; for(const i of bad){ const c = await cardOf(i.intern_id); items.push(`<li>${link(i.intern_id)}: ${esc((c?.actions||[])[0] || 'встреча HR со стажёром')}</li>`); }
    return `План на неделю:<ul>${items.join('')}</ul>`; }
  if(/вниман|кто|риск|красн|плох|проблем/.test(t)){
    const bad = list.filter(i => i.status !== 'green').sort((a,b) => ORDER[a.status]-ORDER[b.status]);
    return bad.length ? `На Месяц ${cur}:<ul>${bad.map(i => `<li>${link(i.intern_id)} — <b>${ST[i.status]}</b>: ${esc(i.reason)}</li>`).join('')}</ul>` : `На Месяц ${cur} все ${list.length} стажёров в норме.`; }
  return null;
}
async function ask(q){
  q = q.trim(); if(!q) return; $('chatq').value = ''; addMsg(esc(q), 'me'); CHAT.hist.push({role:'user', text:q});
  const typing = addMsg('<span class="typing"><i></i><i></i><i></i></span>', 'bot');
  let ans = null;
  if(!S.mock){ try { const r = await fetch(API + '/api/chat', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({question:q, period:S.period, intern_id:S.sel, history:CHAT.hist.slice(-8)})});
      if(r.ok){ const j = await r.json(); ans = j.answer_html || (j.answer ? esc(j.answer).replace(/\n/g,'<br>').replace(/(СТ-\d{3})/g, m => link(m)) : null); } } catch {} }
  if(!ans) ans = await localAnswer(q);
  await new Promise(r => setTimeout(r, 350));
  typing.remove();
  botSay(ans || 'Пока не понял вопрос. Спросите про конкретного стажёра (например, «СТ-004»), про анкеты или про то, что повторяется.');
}
$('askbtn').onclick = () => chatOpen(true); $('chatx').onclick = () => chatOpen(false);
$('chatf').onsubmit = e => { e.preventDefault(); ask($('chatq').value); };

function countUp(el){ const n = +el.dataset.n || 0, t0 = performance.now(), d = 900;
  const f = t => { const k = Math.min(1, (t - t0) / d), e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(n * e); if(k < 1) requestAnimationFrame(f); }; requestAnimationFrame(f); }
function hour(){ const h = new Date().getHours(); return h < 12 ? 'Доброе утро' : h < 18 ? 'Добрый день' : 'Добрый вечер'; }
function renderHero(){
  const L = S.ov.interns || [], red = L.filter(i => i.status === 'red'), yel = L.filter(i => i.status === 'yellow');
  const cur = S.period || S.ov.current_period, k = S.ov.kpi || {};
  const head = red.length ? `${red.length === 1 ? 'Одному стажёру' : red.length + ' стажёрам'} нужна помощь` : yel.length ? `${yel.length} в зоне внимания, критичных нет` : 'Все стажёры в норме';
  const who = [...red, ...yel][0];
  $('hero').innerHTML = `<img src="brand/img/cube.png" alt=""><h2>${hour()}! ${head}</h2>
    <p>Месяц ${cur}: анкеты сдали ${esc(k.responded_interns)} стажёров и ${esc(k.responded_mentors)} наставников.${who ? ` Начните с ${esc(who.intern_id)}: ${esc(who.reason)}.` : ''}</p>
    <div class="cta">${who ? `<button id="heroGo">Открыть ${esc(who.intern_id)}</button>` : ''}<button class="ghost" id="heroAsk">Спросить Радар</button></div>`;
  if(who) $('heroGo').onclick = () => { openIntern(who.intern_id); $('card').scrollIntoView({behavior:'smooth'}); };
  $('heroAsk').onclick = () => chatOpen(true);
}
</script>
