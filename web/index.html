<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Радар стажировки · МГТС</title>
<meta name="theme-color" content="#008AE0">
<link rel="icon" href="brand/logos/logo1.png">
<link rel="stylesheet" href="brand/brand.css">
<script src="vendor/chart.umd.min.js"></script>
<script src="config.js" onerror=""></script>
<script src="shared/store.js?v=4"></script>
<script src="shared/insight.js?v=1"></script>
<script src="hr-tools.js?v=3" onerror=""></script>
<style>
:root{--sh:0 1px 2px rgba(19,64,116,.06),0 12px 32px -10px rgba(0,138,224,.16);--sh-h:0 2px 4px rgba(19,64,116,.08),0 18px 40px -10px rgba(0,138,224,.26);
  --ease:cubic-bezier(.2,0,0,1);--side:248px;--r:22px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--mgts-bg-soft);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--mgts-blue)}
:focus-visible{outline:3px solid var(--mgts-blue-soft);outline-offset:2px;border-radius:10px}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mut{color:var(--mgts-muted)}
.mockbar{background:var(--mgts-orange);color:#fff;text-align:center;font-size:14px;padding:5px 12px;position:relative;z-index:30}

/* ---------- каркас ---------- */
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--mgts-line);display:flex;flex-direction:column;padding:20px 14px;gap:4px;z-index:25}
.logo{display:flex;align-items:center;gap:12px;padding:4px 10px 18px;text-decoration:none}
.logo img{height:38px}
.logo b{font-family:var(--font-title);font-weight:900;color:var(--mgts-blue);font-size:18px;line-height:1.05}
.logo small{display:block;font-family:var(--font-text);font-weight:400;color:var(--mgts-muted);font-size:13px}
.grp{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mgts-muted);padding:14px 12px 6px}
.nav a{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 12px;border-radius:14px;color:var(--mgts-navy);text-decoration:none;font-weight:500;transition:background .2s,color .2s}
.nav a:hover{background:var(--mgts-bg-soft)}
.nav a.on{background:#E3F2FC;color:var(--mgts-blue)}
.nav a em{margin-left:auto;font-style:normal;min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--mgts-orange);color:#fff;font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.nav a em:empty{display:none}
.nav a .ext{margin-left:auto;width:16px;height:16px;opacity:.5}
.side-foot{margin-top:auto;padding:12px}
.live{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mgts-muted)}
.live i{width:9px;height:9px;border-radius:50%;background:var(--st-green);animation:breathe 1.8s ease-in-out infinite}
.live.off i{background:var(--mgts-muted);animation:none}
@keyframes breathe{50%{opacity:.35;transform:scale(.85)}}

.main{min-width:0}
.bar{position:sticky;top:0;z-index:20;background:rgba(242,247,252,.82);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px)}
.bar-in{max-width:1320px;margin:0 auto;padding:16px 32px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.bar h1{margin:0;font-size:26px;line-height:1.15;display:flex;align-items:center;gap:12px}
.bar .mlogo{display:none;height:30px}
.back[hidden]{display:none}
[hidden]{display:none!important}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:#fff;border-radius:12px;min-height:40px;padding:0 14px;color:var(--mgts-navy);font-weight:500;box-shadow:var(--sh);text-decoration:none}
.periods{display:flex;gap:4px;background:#fff;padding:4px;border-radius:14px;margin-left:auto;box-shadow:var(--sh);overflow-x:auto;scrollbar-width:none;max-width:100%}
.periods::-webkit-scrollbar{display:none}
.periods button{border:0;background:none;min-height:38px;padding:0 13px;border-radius:10px;color:var(--mgts-navy);font-weight:500;white-space:nowrap}
.periods button.on{background:var(--mgts-blue);color:#fff}
.periods .lab{align-self:center;color:var(--mgts-muted);font-size:14px;padding:0 6px 0 8px;white-space:nowrap}
#view{max-width:1320px;margin:0 auto;padding:8px 32px 80px}
.rise>*{animation:rise .45s var(--ease) both}
.rise>*:nth-child(2){animation-delay:.04s}.rise>*:nth-child(3){animation-delay:.08s}.rise>*:nth-child(4){animation-delay:.12s}.rise>*:nth-child(5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}

/* ---------- элементы ---------- */
.panel{background:#fff;border-radius:var(--r);padding:22px 24px;margin-bottom:20px;box-shadow:var(--sh)}
.panel h2,.h2{font-size:20px;margin:0 0 14px;display:flex;align-items:center;gap:10px;line-height:1.2}
.panel h2 a,.h2 a{margin-left:auto;font-family:var(--font-text);font-weight:500;font-size:15px;text-decoration:none}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:20px;align-items:start}
.grid2 > div > .panel:last-child{margin-bottom:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:14px;border:1px solid var(--mgts-line);
  background:#fff;color:var(--mgts-navy);font-weight:500;text-decoration:none;transition:transform .15s var(--ease),box-shadow .2s,border-color .2s;white-space:nowrap}
.btn:hover{border-color:var(--mgts-blue);box-shadow:var(--sh)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--mgts-blue);border-color:var(--mgts-blue);color:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:11px}
.btn svg.i{width:19px;height:19px}
.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.st-red{background:var(--st-red)}.st-yellow{background:var(--st-yellow)}.st-green{background:var(--st-green)}.st-grey{background:#C5D3E2}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:30px;padding:4px 12px;font-size:14px;font-weight:500;white-space:nowrap}
.b-red{background:#FDE7E8;color:#B4232A}.b-yellow{background:#FFF2D9;color:#8A5A00}.b-green{background:#E2F6EB;color:#1C7A47}.b-blue{background:#E3F2FC;color:#0069AD}.b-grey{background:#EEF2F6;color:#5E7690}
.empty{padding:22px 0;text-align:center;color:var(--mgts-muted)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%}

/* герой */
.hero{position:relative;overflow:hidden;border-radius:26px;background:linear-gradient(115deg,#008AE0 0%,#0A6FC2 55%,#134074 100%);color:#fff;padding:26px 32px;margin-bottom:20px;box-shadow:var(--sh)}
.hero h2{font-family:var(--font-title);font-weight:900;font-size:28px;line-height:1.15;color:#fff;margin:0 0 6px;max-width:640px}
.hero p{margin:0;opacity:.92;font-size:17px;max-width:600px}
.hero .cta{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
.hero .cta .btn{border:0}
.hero .cta .ghost{background:rgba(255,255,255,.16);color:#fff}
.hero img{position:absolute;right:10px;top:-30px;height:230px;pointer-events:none;animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(10px) rotate(2deg)}}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.kpi{display:block;background:#fff;border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh);text-decoration:none;color:var(--mgts-navy);transition:transform .3s var(--ease),box-shadow .3s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--sh-h)}
.kpi .v{font-family:var(--font-title);font-weight:500;font-size:36px;line-height:1.1}
.kpi .l{font-size:15px;color:var(--mgts-muted);display:flex;align-items:center;gap:8px}
.kpi.red .v{color:var(--st-red)}.kpi.yellow .v{color:#C98100}.kpi.green .v{color:var(--st-green)}
.prog{height:6px;border-radius:3px;background:var(--mgts-bg-soft);margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--mgts-blue);border-radius:3px;transition:width .8s var(--ease)}

/* строки стажёров */
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:12px minmax(0,1fr) auto 20px;gap:14px;align-items:center;text-align:left;width:100%;border:1px solid transparent;
  background:var(--mgts-bg-soft);border-radius:16px;padding:14px 16px;color:var(--mgts-navy);text-decoration:none;transition:transform .25s var(--ease),border-color .2s,box-shadow .25s,background .2s}
.row:hover{border-color:var(--mgts-blue-soft);background:#fff;box-shadow:var(--sh)}
.row.flash{animation:flash 1.4s 3}
@keyframes flash{50%{background:#FFE7E0}}
.row b{font-family:var(--font-title);font-weight:700;font-size:17px}
.row .sub{font-size:14px;color:var(--mgts-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .why{font-size:15px;margin-top:2px}
.row .sc{font-family:var(--font-title);font-weight:500;font-size:16px;text-align:right;white-space:nowrap}
.row .sc small{display:block;font-family:var(--font-text);font-weight:400;font-size:12px;color:var(--mgts-muted)}
.row .chev{color:var(--mgts-muted)}
.trend{font-size:13px;font-weight:700;margin-left:6px}.row .sc small.trend{margin-left:0;font-size:12px}.row .sc small.trend.up{color:var(--st-green)}.row .sc small.trend.down{color:var(--st-red)}.whys{margin:0 0 8px;padding-left:18px;font-size:14px}.whys li{margin:2px 0}.trend.up{color:var(--st-green)}.trend.down{color:var(--st-red)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--mgts-line);background:#fff;color:var(--mgts-navy);font-weight:500}
.chip.on{background:var(--mgts-navy);border-color:var(--mgts-navy);color:#fff}
.chip span{opacity:.7}
.search{flex:1;min-width:200px;max-width:340px;margin-left:auto;min-height:42px;border:1px solid var(--mgts-line);border-radius:14px;padding:0 14px;background:#fff;outline:none}
.search:focus{border-color:var(--mgts-blue)}

/* мини-списки на главной */
.mini{display:flex;flex-direction:column}
.mini > div{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--mgts-line)}
.mini > div:last-child{border-bottom:0}
.mini .grow{flex:1;min-width:0}
.mini .grow small{display:block;color:var(--mgts-muted);font-size:14px}
.qa{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.qa a{display:flex;align-items:center;gap:10px;min-height:56px;padding:10px 14px;border-radius:16px;background:var(--mgts-bg-soft);color:var(--mgts-navy);text-decoration:none;font-weight:500;transition:background .2s,transform .2s var(--ease)}
.qa a:hover{background:#E3F2FC;transform:translateY(-1px)}
.qa a svg{color:var(--mgts-blue)}
.theme{border-radius:14px;background:#FFF4F0;padding:12px 14px;margin-bottom:10px}
.theme q{display:block;color:var(--mgts-muted);font-size:14px;margin-top:4px}

/* матрица анкет */
.mx th,.mx td{padding:9px 6px;text-align:center;font-size:15px;border-bottom:1px solid var(--mgts-line);white-space:nowrap}
.mx th{color:var(--mgts-muted);font-weight:500}
.mx td:first-child,.mx th:first-child{text-align:left}
.mx .cur{background:#F5FAFE}
.cell{display:inline-flex;gap:4px}
.cell span{width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.ok{background:#E2F6EB;color:#1C7A47}.miss{background:#FDE7E8;color:#B4232A}.wait{background:#EEF2F6;color:var(--mgts-muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--mgts-muted);margin-top:10px}
.feed div{padding:9px 0;border-bottom:1px solid var(--mgts-line);font-size:15px}
.feed time{color:var(--mgts-muted);margin-right:8px;font-variant-numeric:tabular-nums}

/* карточка */
.chead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.chead .id{font-family:var(--font-title);font-weight:900;font-size:34px;color:var(--mgts-blue);line-height:1}
.chead .meta{color:var(--mgts-muted);font-size:15px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--mgts-line);margin:0 0 20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;min-height:46px;padding:0 16px;color:var(--mgts-muted);font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--mgts-blue);border-color:var(--mgts-blue)}
.sum{background:var(--mgts-bg-soft);border-radius:16px;padding:16px 18px;margin-bottom:16px;font-size:17px}
.todo label{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--mgts-line);cursor:pointer}
.todo label:last-child{border-bottom:0}
.todo input{width:22px;height:22px;accent-color:var(--st-green);flex:none;margin-top:1px}
.todo .done span{text-decoration:line-through;color:var(--mgts-muted)}
.todo small{display:block;color:var(--mgts-muted);font-size:13px}
.chartbox{height:300px;position:relative}
.chartbox.sm{height:220px}
.modes{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.modes button{border:1px solid var(--mgts-line);background:#fff;border-radius:20px;min-height:38px;padding:0 14px;font-size:14px;color:var(--mgts-navy)}
.modes button.on{background:var(--mgts-navy);border-color:var(--mgts-navy);color:#fff}
.sig{border:1px solid var(--mgts-line);border-radius:16px;padding:14px 16px;margin-bottom:10px;transition:.2s}
.sig.on{border-color:var(--mgts-orange);box-shadow:0 4px 18px rgba(255,118,84,.15)}
.sig .t{display:flex;gap:10px;align-items:center;font-weight:700}
.sig .w{margin:6px 0 8px;font-size:15px}
.ev{display:flex;flex-wrap:wrap;gap:6px}
.ev span{background:var(--mgts-bg-soft);border-radius:8px;padding:4px 10px;font-size:14px}
.ev q{font-style:italic}
.rev{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
.rev button{border:1px solid var(--mgts-line);background:#fff;border-radius:11px;min-height:36px;padding:0 12px;font-size:14px;color:var(--mgts-navy)}
.rev button.on.c{background:var(--st-green);border-color:var(--st-green);color:#fff}
.rev button.on.f{background:var(--mgts-muted);border-color:var(--mgts-muted);color:#fff}
.rev button.on.w{background:var(--mgts-blue);border-color:var(--mgts-blue);color:#fff}
.rev .lnk{border:0;background:none;color:var(--mgts-blue);margin-left:auto;padding:0}
.more{border:1px dashed var(--mgts-line);background:#fff;border-radius:14px;min-height:44px;width:100%;color:var(--mgts-blue);font-weight:500}
.pairs td,.pairs th{padding:9px 8px;font-size:15px;border-bottom:1px solid var(--mgts-line);text-align:center;white-space:nowrap}
.pairs td:first-child,.pairs th:first-child{text-align:left;white-space:normal;min-width:220px}
.gap2{background:#FDE7E8;border-radius:6px}.gap1{background:#FFF2D9;border-radius:6px}
.cm{display:grid;grid-template-columns:110px 1fr 1fr;gap:14px;padding:14px 0;border-bottom:1px solid var(--mgts-line);font-size:15px}
.cm.hl{background:#FFF4F0;border-radius:12px;padding-left:10px;padding-right:10px}
.cm .p{font-family:var(--font-title);font-weight:500;color:var(--mgts-blue);font-size:17px}
.cm h4{margin:0 0 3px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mgts-muted);font-weight:500}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.kud{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--mgts-line)}
.kud:last-child{border-bottom:0}
.kud .ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.kud .ic.k{background:#E2F6EB;color:#1C7A47}.kud .ic.g{background:#E3F2FC;color:var(--mgts-blue)}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--st-green) calc(var(--p)*1%),var(--mgts-bg-soft) 0);display:flex;align-items:center;justify-content:center;flex:none}
.ring b{width:50px;height:50px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--font-title);font-size:15px}

/* модальное окно */
.modal{position:fixed;inset:0;z-index:60;background:rgba(16,44,81,.38);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal.open{opacity:1;pointer-events:auto}
.dlg{background:#fff;border-radius:24px;width:560px;max-width:100%;max-height:calc(100vh - 40px);overflow:auto;box-shadow:0 20px 60px rgba(16,44,81,.3);transform:translateY(14px) scale(.98);transition:transform .25s var(--ease)}
.modal.open .dlg{transform:none}
.dlg header{display:flex;align-items:center;gap:12px;padding:20px 24px 6px}
.dlg header h3{margin:0;font-size:21px}
.dlg header button{margin-left:auto;border:0;background:var(--mgts-bg-soft);width:40px;height:40px;border-radius:12px;font-size:20px}
.dlg .body{padding:8px 24px 6px}
.dlg footer{display:flex;gap:10px;justify-content:flex-end;padding:16px 24px 22px;flex-wrap:wrap}
.fld{display:block;margin:0 0 14px}
.fld > span{display:block;font-size:14px;color:var(--mgts-muted);margin-bottom:6px}
.fld input,.fld textarea,.fld select{width:100%;border:1px solid var(--mgts-line);border-radius:14px;padding:11px 14px;outline:none;background:#fff;min-height:46px}
.fld textarea{min-height:130px;resize:vertical;line-height:1.45}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--mgts-blue)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--mgts-line);background:#fff;border-radius:12px;min-height:42px;padding:0 14px}
.seg button.on{background:var(--mgts-blue);border-color:var(--mgts-blue);color:#fff}
.hfprev{border:1px solid var(--mgts-line);border-radius:16px;padding:14px 16px;background:var(--mgts-bg-soft);font-size:14px}
.hfprev .hd{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-weight:500}
.okmark{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:24px 0}
.okmark i{width:64px;height:64px;border-radius:50%;background:#E2F6EB;color:#1C7A47;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:30px;animation:pop .35s var(--ease)}
@keyframes pop{from{transform:scale(.6);opacity:0}}

/* тост */
.toast{position:fixed;right:24px;bottom:96px;z-index:70;background:var(--mgts-navy);color:#fff;border-radius:16px;padding:14px 18px;max-width:420px;display:flex;gap:14px;align-items:center;
  box-shadow:0 10px 30px rgba(16,44,81,.35);transform:translateY(24px);opacity:0;pointer-events:none;transition:.35s var(--ease)}
.toast.show{transform:none;opacity:1;pointer-events:auto}
.toast b{color:#fff}
.toast button{border:0;background:#fff;color:var(--mgts-navy);border-radius:10px;min-height:36px;padding:0 12px;font-weight:500;white-space:nowrap}

/* чат */
.askbtn{position:fixed;right:24px;bottom:24px;z-index:40;display:flex;align-items:center;gap:10px;border:0;border-radius:30px;background:var(--mgts-blue);color:#fff;
  min-height:54px;padding:0 22px 0 16px;font-weight:500;box-shadow:0 10px 30px rgba(0,138,224,.35);transition:transform .2s var(--ease)}
.askbtn:hover{transform:translateY(-2px)}
.chat{position:fixed;right:24px;bottom:24px;z-index:45;width:420px;max-width:calc(100vw - 32px);height:600px;max-height:calc(100vh - 48px);background:#fff;border-radius:24px;
  box-shadow:0 20px 60px rgba(16,44,81,.28);display:flex;flex-direction:column;overflow:hidden;transform:translateY(20px) scale(.98);opacity:0;pointer-events:none;transition:.22s var(--ease)}
.chat.open{transform:none;opacity:1;pointer-events:auto}
.chat header{display:flex;align-items:center;gap:12px;padding:16px 18px;background:var(--mgts-blue);color:#fff}
.chat header b{font-family:var(--font-title);font-weight:700;font-size:17px}
.chat header small{display:block;opacity:.85;font-size:13px}
.chat header button{margin-left:auto;border:0;background:rgba(255,255,255,.18);color:#fff;width:40px;height:40px;border-radius:12px;font-size:20px}
.msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--mgts-bg-soft)}
.msg{max-width:88%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.45;animation:pop2 .18s ease-out}
.msg.me{align-self:flex-end;background:var(--mgts-blue);color:#fff;border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:#fff;color:var(--mgts-navy);border-bottom-left-radius:6px;box-shadow:0 1px 2px rgba(16,44,81,.06)}
.msg.bot ul{margin:6px 0 0;padding-left:18px}.msg.bot li{margin:3px 0}
.msg a{color:var(--mgts-blue);cursor:pointer;font-weight:500;text-decoration:none;border-bottom:1px dashed}
.typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--mgts-muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}@keyframes pop2{from{transform:translateY(6px);opacity:0}}
.sugg{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 0;background:#fff;scrollbar-width:none}
.sugg button{border:1px solid var(--mgts-line);background:#fff;border-radius:16px;min-height:36px;padding:0 12px;font-size:14px;color:var(--mgts-navy);white-space:nowrap}
.chat form{display:flex;gap:8px;padding:12px 14px 14px;background:#fff}
.chat input{flex:1;border:1px solid var(--mgts-line);border-radius:14px;padding:0 14px;min-height:46px;outline:none}
.chat input:focus{border-color:var(--mgts-blue)}
.chat form button{border:0;background:var(--mgts-blue);color:#fff;border-radius:14px;width:48px;font-size:18px}

/* мобильная навигация */
.tabbar{display:none}
.shim{display:none}
@media (max-width:1180px){.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:280px;transform:translateX(-100%);transition:transform .28s var(--ease)}
  .side.open{transform:none;box-shadow:0 0 60px rgba(16,44,81,.25)}
  .shim{display:block;position:fixed;inset:0;background:rgba(16,44,81,.3);z-index:24;opacity:0;pointer-events:none;transition:opacity .2s}
  .shim.open{opacity:1;pointer-events:auto}
  .bar-in{padding:12px 16px;gap:10px}
  .bar .mlogo{display:block}
  .bar h1{font-size:21px}
  .periods{margin-left:0;width:100%}
  .periods .lab{display:none}
  #view{padding:4px 16px 110px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);border-top:1px solid var(--mgts-line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;justify-content:center;border:0;background:none;color:var(--mgts-muted);
    font-size:12px;font-weight:500;text-decoration:none;position:relative}
  .tabbar .on{color:var(--mgts-blue)}
  .tabbar em{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--mgts-orange);color:#fff;font-size:11px;font-style:normal;display:flex;align-items:center;justify-content:center;padding:0 5px}
  .tabbar em:empty{display:none}
  .askbtn{bottom:84px;right:16px;padding:0;width:56px;justify-content:center}
  .askbtn span{display:none}
  .chat{right:0;bottom:0;width:100%;max-width:100%;height:100%;max-height:100%;border-radius:0}
  .toast{left:16px;right:16px;bottom:150px;max-width:none}
  .hero{padding:20px;border-radius:22px}.hero h2{font-size:22px}.hero p{font-size:16px}.hero img{opacity:.22;height:180px}
  .kpis{gap:10px}.kpi{padding:14px 16px}.kpi .v{font-size:30px}
  .panel{padding:18px 16px;border-radius:20px}
  .row{grid-template-columns:12px minmax(0,1fr) auto;padding:12px 14px}
  .row .chev{display:none}
  .qa{grid-template-columns:1fr}
  .chead .id{font-size:28px}
  .acts{margin-left:0;width:100%}
  .acts .btn{flex:1 1 calc(50% - 8px)}
  .cm{grid-template-columns:1fr;gap:6px}
  .search{max-width:none;margin-left:0;min-width:100%}
  .modal{align-items:flex-end;padding:0}
  .dlg{border-radius:24px 24px 0 0;max-height:92vh}
}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
@media print{.side,.tabbar,.askbtn,.chat,.bar .periods{display:none!important}.app{display:block}}
</style></head>

<script>
const S = {ov:null, period:null, card:null, cardId:null, ver:null, mock:null, chart:null, mode:'avg', focus:null, tab:'sum', filter:'all', q:'',
           onlyConfirmed:false, allSig:false, feed:[], flash:null};
const RS = window.RadarStore;
const qs = new URLSearchParams(location.search);
const API = RS.API, STATIC_HOST = RS.STATIC;
const MOCKS = [2,3,4,6];
const ST = {red:'Критично', yellow:'Внимание', green:'В норме', grey:'Нет данных'};
const ORDER = {red:0, yellow:1, grey:2, green:3};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = v => v == null ? '—' : String(v).replace('.', ',');
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const ico = (n, cls = '') => `<svg class="i ${cls}"><use href="#i-${n}"/></svg>`;
const cur = () => S.period || S.ov?.current_period;
const byRisk = (a, b) => (ORDER[a.status] ?? 9) - (ORDER[b.status] ?? 9) || (b.signals || 0) - (a.signals || 0);
const keep = () => { const p = new URLSearchParams(); if(S.mock && qs.has('mock')) p.set('mock', qs.get('mock')); if(qs.get('api')) p.set('api', qs.get('api')); return p; };
const reportUrl = (o = {}) => { const p = keep(); p.set('period', cur()); for(const [k, v] of Object.entries(o)) p.set(k, v); return 'report.html?' + p; };
const internUrl = id => { const p = keep(); p.set('id', id); if(S.period) p.set('period', S.period); return 'intern.html?' + p; };

// ---------- данные: API, при недоступности — моки ----------
async function getJSON(url){ const r = await fetch(url, {cache:'no-store'}); if(!r.ok) throw new Error(r.status); return r.json(); }
function mockDir(p){ const want = p || 6; return 'mock/p' + (MOCKS.filter(m => m <= want).pop() || MOCKS[0]); }
async function loadOverview(){
  if(S.mock) return getJSON(`${mockDir(S.period)}/overview.json`);
  try { return await getJSON(API + '/api/overview' + (S.period ? `?period=${S.period}` : '')); }
  catch(e){ S.mock = 'auto'; banner(); return getJSON(`${mockDir(S.period)}/overview.json`); }
}
async function loadIntern(id){
  if(S.mock) return getJSON(`${mockDir(S.period)}/intern_${id}.json`);
  return getJSON(API + `/api/interns/${encodeURIComponent(id)}` + (S.period ? `?period=${S.period}` : ''));
}
function banner(){ const b = $('mockbar'); b.hidden = !S.mock;
  b.textContent = S.mock === 'auto' ? 'Нет связи с сервером — показаны сохранённые данные' : `Демо-данные · срез на Месяц ${S.period || 6}`; }

// действия для HR: из анализа, а если пусто — по сигналам
function actionsOf(c){
  if((c.actions || []).length) return c.actions.map(t => ({t}));
  const out = [], add = (t, why) => { if(!out.find(x => x.t === t)) out.push({t, why}); };
  for(const s of c.signals || []){
    const t = (s.title || '').toLowerCase();
    if(/нагрузк/.test(t)) add('Обсудить с наставником нагрузку и приоритеты', s.title);
    else if(/понятн|понимани/.test(t)) add('Наставнику: проговорить ожидания по задачам', s.title);
    else if(/поддержк|обратн/.test(t)) add('Ввести еженедельную встречу 15 минут с наставником', s.title);
    else if(/пропуск|не заполн/.test(t)) add('Напомнить про анкету', s.title);
    else if(/расхожд|разрыв/.test(t)) add('Встреча втроём: стажёр, наставник, HR', s.title);
    else if(/сниж|паден/.test(t)) add('Короткая встреча HR со стажёром', s.title);
  }
  if(c.status === 'red') add('Встреча HR со стажёром на этой неделе');
  if(c.status !== 'green' && out.length) add('Проверить на следующем пульс-опросе');
  return out.slice(0, 4);
}

// ---------- решения HR по сигналам ----------
const RKEY = 'radar.reviews';
function reviews(){ return RS.ls.get(RKEY, {}); }
function reviewOf(sig){ return reviews()[sig.id] ?? sig.review?.status ?? null; }
async function setReview(id, status){
  const all = reviews(); all[id] = all[id] === status ? null : status; RS.ls.set(RKEY, all);
  if(!S.mock) fetch(API + `/api/signals/${encodeURIComponent(id)}/review`, {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({status: all[id] || 'none', intern_id: S.cardId, period: cur()})}).catch(() => {});
  renderView();
}

// ---------- маршруты ----------
const TITLES = {home:'Главная', interns:'Стажёры', surveys:'Анкеты', inbox:'Обращения', onboarding:'Адаптация', talent:'Кадровый резерв'};
function route(){ const h = decodeURIComponent(location.hash.replace(/^#\/?/, '')); const [r, a] = h.split('/'); return {r: r || 'home', a}; }
function go(h){ if(location.hash === h) renderView(); else location.hash = h; }
async function renderView(){
  if(!S.ov) return;
  const {r, a} = route();
  document.querySelectorAll('[data-r]').forEach(x => x.classList.toggle('on', x.dataset.r === (r === 'intern' ? 'interns' : r)));
  $('back').hidden = r !== 'intern';
  $('periods').style.display = ['inbox', 'onboarding'].includes(r) ? 'none' : '';
  $('navReport').href = reportUrl();
  closeMenu();
  const v = $('view');
  if(r === 'intern' && a){
    $('title').textContent = 'Стажёр';
    if(S.cardId !== a || !S.card){ S.cardId = a; S.focus = null; S.allSig = false; S.tab = S.tab || 'sum';
      v.innerHTML = '<div class="panel"><div class="empty">Загрузка…</div></div>';
      try { S.card = await loadIntern(a); } catch { S.card = null; } }
    return viewIntern(v);
  }
  $('title').textContent = TITLES[r] || 'Радар';
  document.title = (TITLES[r] || 'Радар') + ' · Радар стажировки МГТС';
  if(r === 'interns'){ if(a) S.filter = a; return viewInterns(v); }
  if(r === 'surveys') return viewSurveys(v);
  if(['inbox', 'onboarding', 'talent'].includes(r)){
    v.className = 'rise'; v.innerHTML = '';
    const box = document.createElement('div'); v.appendChild(box);
    if(window.RadarHR?.views?.[r]) return window.RadarHR.views[r](box, ctx());
    box.innerHTML = '<div class="panel"><div class="empty">Раздел подключается…</div></div>'; return;
  }
  return viewHome(v);
}
const ctx = () => ({ov:S.ov, period:cur(), go, toast, openIntern: id => go('#/intern/' + id), esc});
addEventListener('hashchange', () => { scrollTo({top:0}); renderView(); });

// ---------- период ----------
function renderPeriods(){
  // список месяцев копим: бэк со срезом «на Месяц N» отдаёт только 1…N
  S.allP = [...new Set([...(S.allP || []), ...(S.ov.periods || []), S.ov.current_period, ...(S.mock ? MOCKS : [])].filter(Boolean))].sort((a, b) => a - b);
  if(S.allP.length < 6 && !S.mock && !S.allPLoaded){ S.allPLoaded = true; getJSON(API + '/api/overview').then(o => { S.allP = [...new Set([...S.allP, ...(o.periods || [])])].sort((a, b) => a - b); renderPeriods(); }).catch(() => {}); }
  const ps = S.allP;
  $('periods').innerHTML = '<span class="lab">Срез на</span>' + ps.map(p =>
    `<button class="${p===cur()?'on':''}" data-p="${p}" aria-pressed="${p===cur()}">Месяц ${p}</button>`).join('');
  $('periods').querySelectorAll('button').forEach(b => b.onclick = async () => {
    const p = +b.dataset.p; S.period = (p === Math.max(...ps) && !S.mock) ? null : p; S.card = null; S.focus = null; await refresh();
  });
  const on = $('periods').querySelector('.on'); if(on) $('periods').scrollLeft = on.offsetLeft - 60;
}

// ---------- главная ----------
function hour(){ const h = new Date().getHours(); return h < 12 ? 'Доброе утро' : h < 18 ? 'Добрый день' : 'Добрый вечер'; }
function missing(){
  const out = [];
  for(const r of S.ov.survey_status || []){ const c = (r.periods || {})[cur()] || {};
    if(!c.intern) out.push({id:r.intern_id, who:'Стажёр', name:r.intern_id}); if(!c.mentor) out.push({id:r.intern_id, who:'Наставник', name:r.mentor_id}); }
  return out;
}
function surveyStat(){
  const rows = S.ov.survey_status || []; let n = 0;
  rows.forEach(r => { const c = (r.periods || {})[cur()] || {}; n += (c.intern ? 1 : 0) + (c.mentor ? 1 : 0); });
  return {n, total: rows.length * 2};
}
function rowHtml(i){
  return `<a class="row ${i.intern_id===S.flash?'flash':''}" href="#/intern/${esc(i.intern_id)}">
    <span class="dot st-${i.status||'grey'}" title="${ST[i.status]||''}"></span>
    <span style="min-width:0"><b>${esc(i.intern_id)}</b> <span class="sub">· ${esc(i.department)}</span>
      <div class="why">${esc(i.status === 'green' ? 'Всё в порядке' : (i.reason || ST[i.status]))}</div></span>
    <span class="sc" title="Средняя оценка в пульс-опросе стажёра за Месяц ${cur()} (из 5) и изменение к прошлому месяцу">${fmt(i.intern_avg)}<span class="mut" style="font-size:12px"> из 5</span>
      <small>оценка стажёра</small>${i.trend ? `<small class="trend ${i.trend>0?'up':'down'}">${i.trend>0?'▲ +':'▼ −'}${fmt(Math.abs(i.trend))} за месяц</small>` : ''}</span>
    <span class="chev">›</span></a>`;
}

// Бэк размечает темы комментариев по каждому стажёру (comment_analysis). Здесь только сводим их:
// тема, которая в месяцы с риском встречалась у 2+ стажёров, — вопрос уровня программы, а не одного человека.
const plural = window.RadarInsight.plural;
const monthsTxt = ms => { ms = [...new Set(ms)].sort((a, b) => a - b); return ms.length > 2 && ms.at(-1) - ms[0] === ms.length - 1 ? `М${ms[0]}–${ms.at(-1)}` : ms.map(m => 'М' + m).join(', '); };
const STEMS = {'Коммуникация':['общ','коммуник','обратн','встреч','связ','созвон'], 'Поддержка наставника':['наставн','поддерж','сверк','обратн'],
  'Нагрузка':['нагруз','срок','много задач','перегр'], 'Навыки стажёра':['навык','опыт','самостоят','умени','знани'], 'Задачи и их качество':['задач','постановк','переделыв'],
  'Процессы и организация':['процесс','организац','доступ','согласован'], 'Команда и атмосфера':['команд','коллег','атмосфер']};
function quoteFor(topic, p){
  const stems = STEMS[topic] || topic.toLowerCase().split(/[^а-яё]+/).filter(w => w.length > 3).map(w => w.slice(0, 5));
  const texts = [...Object.values(p.comments?.intern || {}), ...Object.values(p.comments?.mentor || {})].filter(t => t && t !== 'nan');
  const sent = texts.flatMap(t => String(t).split(/(?<=[.!?;])\s+/)).find(s => stems.some(st => s.toLowerCase().includes(st)));

function drawChart(c){

    const base = k => { const v = P.slice(0, 3).map(p => p[k]).filter(x => x != null); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
    const bi = base('intern_avg'), bm = base('mentor_avg');
    a = P.map(p => p.intern_avg != null && bi != null ? +(p.intern_avg - bi).toFixed(2) : null);

    const pr = c.pairs[+S.mode.slice(4)]; a = pr.by_period.map(x => x[0]); b = pr.by_period.map(x => x[1]); la = pr.intern; lb = pr.mentor; note = `${pr.intern} ↔ ${pr.mentor}`;

    {label:la, data:a, borderColor:css('--mgts-blue'), backgroundColor:col.map(x => x || css('--mgts-blue')), pointRadius:rad, borderWidth:3, tension:.3, spanGaps:true},
    {label:lb, data:b, borderColor:css('--mgts-navy'), backgroundColor:col.map(x => x || css('--mgts-navy')), pointRadius:rad, borderWidth:2, borderDash:[6, 4], tension:.3, spanGaps:true},

$('moreBtn').onclick = () => { $('side').classList.add('open'); $('shim').classList.add('open'); };
$('shim').onclick = closeMenu;
addEventListener('keydown', e => { if(e.key === 'Escape'){ closeDlg(); closeMenu(); chatOpen(false); } });

(async function init(){
  if(qs.has('mock')){ S.mock = 'param'; S.period = +qs.get('mock') || 6; }
  else if(STATIC_HOST){ S.mock = 'param'; S.period = 4; }
  if(qs.has('period') && !S.mock) S.period = +qs.get('period');
  await refresh();
  await poll(); setInterval(poll, 3000);
})();

// ---------- чат «Спросить Радар» ----------
// Отвечает по данным дашборда (работает и без бэка). Если у бэка есть POST /api/chat — спрашивает ИИ (YandexGPT).
const CHAT = {hist:[]};
const SUGG = ['Кто в зоне риска?', 'Почему СТ-004?', 'Кто не сдал анкету?', 'Что повторяется?', 'План на неделю'];
function chatOpen(v){ $('chat').classList.toggle('open', v); $('askbtn').style.display = v ? 'none' : ''; if(v){ if(!CHAT.hist.length) botSay(hello()); setTimeout(() => $('chatq').focus(), 200); } }
function hello(){ const r = (S.ov?.interns||[]).filter(i => i.status === 'red').length, y = (S.ov?.interns||[]).filter(i => i.status === 'yellow').length;
  return `Привет! Я знаю все анкеты стажёров и наставников. Сейчас: <b>${r}</b> критичн., <b>${y}</b> в зоне внимания. Что посмотрим?`; }
function addMsg(html, who){ const d = document.createElement('div'); d.className = 'msg ' + who; d.innerHTML = html; $('msgs').appendChild(d);
  $('msgs').scrollTop = 1e6; d.querySelectorAll('a[data-id]').forEach(a => a.onclick = () => { S.tab = 'sum'; go('#/intern/' + a.dataset.id); if(innerWidth < 900) chatOpen(false); }); return d; }
function botSay(html){ CHAT.hist.push({role:'assistant', text:html.replace(/<[^>]+>/g, '')}); return addMsg(html, 'bot'); }
function renderSugg(){ $('sugg').innerHTML = SUGG.map(q => `<button type="button">${esc(q)}</button>`).join('');
  $('sugg').querySelectorAll('button').forEach(b => b.onclick = () => ask(b.textContent)); }
const link = id => `<a data-id="${esc(id)}">${esc(id)}</a>`;
async function cardOf(id){ try { return await loadIntern(id); } catch { return null; } }
async function localAnswer(q){
  const t = q.toLowerCase(), ov = S.ov || {}, list = ov.interns || [];
  const idm = q.toUpperCase().replace(/C/g, 'С').replace(/T/g, 'Т').match(/СТ-?\s?0*(\d+)/);
  const id = idm ? 'СТ-' + String(idm[1]).padStart(3, '0') : null;
  const p = cur();
  if(id && /почему|что с|как дела|расскажи|сигнал|риск|красн|жёлт|желт/.test(t) || id && !/сдела|делать|действ|встреч|помочь/.test(t) && !/наставник|расхожд/.test(t)){
    const c = await cardOf(id); if(!c) return `Не нашёл ${esc(id)}.`;
    const gr = groupsOf(c);
    if(!gr.length) return `${link(id)} (${esc(c.department)}): ${esc(summaryOf(c, gr))}`;
    const acts = actionsOf(c);
    return `${link(id)} · ${esc(c.department)} — <b>${ST[c.status]}</b>. ${esc(summaryOf(c, gr))}<ul>${gr.slice(0, 3).map(g => { const q = g.ev.find(e => e.quote);
      return `<li><b>${esc(g.subj)}</b> — ${esc(whoOf(g))}${q ? `: «${esc(q.quote)}» (${esc(q.source)}, М${q.period})` : ''}</li>`; }).join('')}</ul>${acts.length ? 'Что сделать: ' + acts.map(a => esc(a.t)).join('; ') + '.' : ''}`;
  }
  if(id && /сдела|делать|действ|встреч|помочь/.test(t)){ const c = await cardOf(id); const acts = c ? actionsOf(c) : []; return acts.length ? `По ${link(id)}:<ul>${acts.map(a => `<li>${esc(a.t)}</li>`).join('')}</ul>` : `По ${link(id)} действий не требуется.`; }
  if(id && /наставник|расхожд|разрыв/.test(t)){ const c = await cardOf(id); if(!c) return 'Не нашёл стажёра.';
    const g = (c.pairs||[]).map(p => { const l = p.by_period.filter(x => x[0] != null && x[1] != null).at(-1); return l ? {p, d:l[0] - l[1], l} : null; }).filter(Boolean).sort((a, b) => Math.abs(b.d) - Math.abs(a.d));
    return g.length ? `${link(id)}: самое большое расхождение — «${esc(g[0].p.intern)}» ${g[0].l[0]} у стажёра против ${g[0].l[1]} у наставника.` : 'Нет данных для сравнения.'; }
  if(/не заполн|не ответ|пропуск|анкет/.test(t)){
    const miss = missing();
    return miss.length ? `За Месяц ${p} нет анкет:<ul>${miss.map(m => `<li>${m.who === 'Стажёр' ? link(m.id) : esc(m.name) + ' — наставник ' + link(m.id)}</li>`).join('')}</ul>Напомнить можно в разделе «Анкеты».` : `За Месяц ${p} анкеты заполнили все.`; }
  if(/повтор|общ|програм|тем|чаще/.test(t)){
    const th = await programThemes().catch(() => []);
    if(th.length) return `Повторяется у нескольких стажёров (по комментариям с риском):<ul>${th.map(x => `<li><b>${esc(x.topic)}</b> — у ${(x.interns||[]).map(link).join(', ')}</li>`).join('')}</ul>Это вопрос к программе: например, ввести регулярные короткие 1:1 с наставником.`;
    const cnt = {}; for(const i of list){ const c = await cardOf(i.intern_id); (c?.periods||[]).forEach(pp => (pp.comment_analysis?.topics||[]).forEach(tp => { (cnt[tp] ||= new Set()).add(i.intern_id); })); }
    const top = Object.entries(cnt).filter(([, v]) => v.size > 1).sort((a, b) => b[1].size - a[1].size).slice(0, 4);
    return top.length ? `Чаще всего в комментариях:<ul>${top.map(([k, v]) => `<li><b>${esc(k)}</b> — у ${[...v].map(link).join(', ')}</li>`).join('')}</ul>` : 'Общих тем у нескольких стажёров не нашёл.'; }
  if(/недел|сделать|план|приорит|hr/.test(t)){
    const bad = list.filter(i => i.status !== 'green').sort(byRisk);
    if(!bad.length) return 'Все стажёры в норме. Хорошее время дать обратную связь и провести 1:1.';
    const items = []; for(const i of bad){ const c = await cardOf(i.intern_id); items.push(`<li>${link(i.intern_id)}: ${esc((c ? actionsOf(c)[0]?.t : '') || 'встреча HR со стажёром')}</li>`); }
    return `План на неделю:<ul>${items.join('')}</ul>`; }
  if(/вниман|кто|риск|красн|плох|проблем/.test(t)){
    const bad = list.filter(i => i.status !== 'green').sort(byRisk);
    return bad.length ? `На Месяц ${p}:<ul>${bad.map(i => `<li>${link(i.intern_id)} — <b>${ST[i.status]}</b>: ${esc(i.reason)}</li>`).join('')}</ul>` : `На Месяц ${p} все ${list.length} стажёров в норме.`; }
  return null;
}
async function ask(q){
  q = q.trim(); if(!q) return; $('chatq').value = ''; addMsg(esc(q), 'me'); CHAT.hist.push({role:'user', text:q});
  const typing = addMsg('<span class="typing"><i></i><i></i><i></i></span>', 'bot');
  let ans = null;
  if(!S.mock){ try { const r = await fetch(API + '/api/chat', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({question:q, period:S.period, intern_id:S.cardId, history:CHAT.hist.slice(-8)})});
      if(r.ok){ const j = await r.json(); ans = j.answer_html || (j.answer ? esc(j.answer).replace(/\n/g, '<br>').replace(/(СТ-\d{3})/g, m => link(m)) : null);
        if(ans && (j.sources || []).length) ans += `<div style="margin-top:6px;font-size:12px;color:var(--mgts-muted)">Источники: ${j.sources.map(esc).join(' · ')}${j.engine ? ' · ' + esc(j.engine) : ''}</div>`; } } catch {} }
  if(!ans) ans = await localAnswer(q);
  await new Promise(r => setTimeout(r, 350));
  typing.remove();
  botSay(ans || 'Пока не понял вопрос. Спросите про конкретного стажёра (например, «СТ-004»), про анкеты или про то, что повторяется.');
}
$('askbtn').onclick = () => chatOpen(true); $('chatx').onclick = () => chatOpen(false);
$('chatf').onsubmit = e => { e.preventDefault(); ask($('chatq').value); };
renderSugg();

function countUp(el){ const n = +el.dataset.n || 0, t0 = performance.now(), d = 900;
  const f = t => { const k = Math.min(1, (t - t0) / d), e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(n * e); if(k < 1) requestAnimationFrame(f); }; requestAnimationFrame(f); }
</script>
</body></html>
