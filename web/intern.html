<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#008AE0">
<title>Моя стажировка · МГТС</title>
<link rel="icon" href="brand/logos/logo1.png">
<link rel="stylesheet" href="brand/brand.css">
<script src="vendor/chart.umd.min.js"></script>
<script src="config.js"></script>
<script src="shared/store.js"></script>
<script src="shared/intern-assistant.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ease:cubic-bezier(.2,0,0,1);--r:22px;--shadow:0 1px 2px rgba(19,64,116,.06),0 8px 24px -12px rgba(19,64,116,.18);--tabh:64px;--side:248px}
html,body{margin:0}
body{background:var(--mgts-bg-soft);font-size:16px;line-height:1.45;min-height:100vh;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
.wrap{max-width:480px;margin:0 auto;padding-bottom:calc(var(--tabh) + 28px + env(safe-area-inset-bottom))}
.wrap.nonav{padding-bottom:calc(28px + env(safe-area-inset-bottom))}
@media (min-width:520px) and (max-width:899px){.wrap{box-shadow:0 0 0 1px var(--mgts-line);min-height:100vh}}

/* появление по очереди */
.rise{opacity:0;transform:translateY(14px);animation:rise .6s var(--ease) forwards;animation-delay:calc(var(--i,0) * 60ms + 40ms)}
@keyframes rise{to{opacity:1;transform:none}}
.quiet .rise,.settled .rise{animation:none;opacity:1;transform:none}

/* ---------- навигация: таб-бар / боковое меню ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--mgts-line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
.nav .brandrow,.nav .navfoot{display:none}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:48px;color:var(--mgts-muted);font-size:11.5px;font-weight:500;text-decoration:none;transition:color .2s var(--ease)}
.tab .ti{position:relative;display:grid;place-items:center;width:56px;height:30px;border-radius:15px;transition:background .3s var(--ease)}
.tab[aria-current="page"]{color:var(--mgts-blue)}
.tab[aria-current="page"] .ti{background:rgba(0,138,224,.12)}
.tab:active .ti{transform:scale(.92)}
.dot{position:absolute;top:3px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--mgts-orange);box-shadow:0 0 0 2px #fff}
@media (min-width:900px){
  .wrap{max-width:none;margin:0 0 0 var(--side);padding:24px 40px 48px}
  .wrap > *{max-width:760px;margin-left:auto;margin-right:auto}
  .wrap.nonav{margin:0 auto;max-width:560px;padding-top:24px}
  .nav{top:0;right:auto;width:var(--side);border-top:0;border-right:1px solid var(--mgts-line);background:#fff;padding:22px 14px}
  .nav-in{display:flex;flex-direction:column;gap:4px;height:100%;max-width:none}
  .nav .brandrow{display:flex;align-items:center;gap:10px;padding:0 10px 22px}
  .nav .brandrow img{width:36px;height:36px;border-radius:10px}
  .nav .brandrow b{font-family:var(--font-title);font-weight:700;font-size:14px;color:var(--mgts-navy);line-height:1.15}
  .nav .brandrow small{display:block;font-family:var(--font-text);font-weight:400;font-size:12px;color:var(--mgts-muted)}
  .tab{flex-direction:row;justify-content:flex-start;gap:12px;min-height:48px;padding:0 10px;border-radius:14px;font-size:15px}
  .tab .ti{width:auto;height:auto;background:none!important}
  .tab[aria-current="page"]{background:rgba(0,138,224,.10)}
  .tab:hover{background:var(--mgts-bg-soft)}
  .dot{top:14px;right:12px;left:auto}
  .nav .navfoot{display:block;margin-top:auto;padding:0 10px;font-size:12px;color:var(--mgts-muted)}
  .hero{border-radius:32px}
  .cube{width:200px;height:200px;right:10px}
}

/* ---------- шапка ---------- */
.hero{position:relative;background:var(--mgts-blue);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 20px 64px;border-radius:0 0 32px 32px;overflow:hidden}
.hero::after{content:"";position:absolute;right:-70px;bottom:-90px;width:240px;height:240px;border-radius:50%;border:1px solid rgba(255,255,255,.18)}
.bar{display:flex;align-items:center;gap:10px;position:relative;z-index:2;min-height:36px}
.bar img{width:30px;height:30px;border-radius:8px}
.bar b{font-family:var(--font-title);font-weight:700;font-size:13px;letter-spacing:.02em}
@media (min-width:900px){.hero .bar img,.hero .bar b{display:none}}
.who{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 14px;border-radius:18px;background:rgba(255,255,255,.16);font-size:14px;font-weight:500;color:#fff;text-decoration:none;transition:background .2s var(--ease)}
.who:active{background:rgba(255,255,255,.28)}
.hello{position:relative;z-index:2;margin-top:30px;max-width:60%}
.hello h1{color:#fff;margin:0;font-size:38px;line-height:1;letter-spacing:-.01em}
.hello .m{font-family:var(--font-light);font-weight:300;font-size:20px;margin-top:10px;line-height:1.2}
.hello .m b{font-family:var(--font-title);font-weight:500}
.dept{font-size:14px;opacity:.8;margin-top:6px}
.cube{position:absolute;right:-18px;top:calc(40px + env(safe-area-inset-top));width:168px;height:168px;z-index:1;pointer-events:none;animation:bob 7s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-2deg)}}
.prog{position:relative;z-index:2;margin-top:26px}
.segs{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.segs i{height:8px;border-radius:4px;background:rgba(255,255,255,.24);position:relative;overflow:hidden}
.segs i::after{content:"";position:absolute;inset:0;background:#fff;border-radius:inherit;transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease);transition-delay:calc(var(--k) * 90ms + 200ms)}
.segs i.on::after{transform:scaleX(1)}
.prog small{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;opacity:.85}

/* шапка вкладок */
.ph{display:flex;align-items:flex-start;gap:12px;padding:calc(22px + env(safe-area-inset-top)) 20px 4px}
.ph h1{margin:0;font-size:28px;line-height:1.05;color:var(--mgts-navy)}
.ph p{margin:6px 0 0;font-size:14px;color:var(--mgts-muted)}
.ph .who{background:#fff;color:var(--mgts-navy);box-shadow:var(--shadow);flex:none}
@media (min-width:900px){.ph{padding:8px 4px 4px}}

/* ---------- гид «Куб» ---------- */
.guide{position:relative;z-index:3;margin:-40px 16px 0;background:#fff;border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:start}
.ava{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#fff 0,#EAF4FC 60%,#D6E9F8 100%);display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(0,138,224,.12)}
.ava img{width:40px;height:40px;animation:breathe 4s ease-in-out infinite}
.ava.sm{width:30px;height:30px}.ava.sm img{width:23px;height:23px}
@keyframes breathe{50%{transform:scale(1.04)}}
.say small{display:block;font-size:12px;color:var(--mgts-muted);font-weight:500;margin-bottom:2px}
.say p{margin:0;font-size:15.5px;line-height:1.4;color:var(--mgts-navy)}
.gact{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.gact .btn{flex:1 1 auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:14px;background:var(--mgts-bg-soft);color:var(--mgts-navy);font-weight:500;font-size:15px;text-decoration:none;transition:transform .18s var(--ease),background .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--mgts-blue);color:#fff}
.btn.wide{width:100%}

/* ---------- главная кнопка ---------- */
.cta{margin:12px 16px 0;background:#fff;border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.go{display:flex;align-items:center;gap:12px;min-height:60px;padding:0 10px 0 20px;border-radius:16px;background:var(--mgts-orange);color:#fff;text-decoration:none;font-weight:700;font-size:17px;transition:transform .18s var(--ease),filter .2s}
.go:active{transform:scale(.97);filter:brightness(.95)}
.go span{flex:1}
.go small{font-weight:500;opacity:.9}
.go .arr{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.22);display:grid;place-items:center;transition:transform .3s var(--ease)}
.go:hover .arr{transform:translateX(3px)}
.state{display:flex;align-items:center;gap:8px;margin:12px 6px 2px;font-size:14px;color:var(--mgts-navy)}
.state i{width:8px;height:8px;border-radius:50%;background:var(--st-green);flex:none}
.state.wait i{background:var(--mgts-orange);box-shadow:0 0 0 0 rgba(255,118,84,.5);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(255,118,84,0)}100%{box-shadow:0 0 0 0 rgba(255,118,84,0)}}
@media (min-width:900px){.guide,.cta,section,.demo{margin-left:auto!important;margin-right:auto!important}.guide{margin-top:-40px!important;width:calc(100% - 48px)}}

/* ---------- секции ---------- */
section{margin:28px 16px 0}
.h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 4px 12px}
.h h2{margin:0;font-size:21px;line-height:1.15;color:var(--mgts-navy)}
.h span{font-size:13px;color:var(--mgts-muted);text-align:right}
.card{background:#fff;border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.avg{display:flex;align-items:flex-end;gap:12px}
.avg .v{font-family:var(--font-title);font-weight:500;font-size:44px;line-height:.9;color:var(--mgts-navy)}
.avg .of{font-size:14px;color:var(--mgts-muted);padding-bottom:4px}
.pill{margin-left:auto;display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:14px;font-size:13px;font-weight:500;background:var(--mgts-bg-soft);white-space:nowrap}
.pill.up{color:#1E8A50;background:rgba(43,174,102,.12)}
.pill.down{color:#C2373C;background:rgba(229,72,77,.10)}
.chartbox{position:relative;height:150px;margin:14px -4px 0}
.cap{font-size:12px;color:var(--mgts-muted);margin-top:6px}
.moves{display:grid;gap:10px;margin-top:10px}
.mv{display:flex;align-items:center;gap:14px;background:#fff;border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.mv .ic{flex:none;width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:15px;font-weight:700}
.mv.up .ic{background:rgba(43,174,102,.12);color:#1E8A50}
.mv.down .ic{background:rgba(229,72,77,.10);color:#C2373C}
.mv.flat .ic{background:var(--mgts-bg-soft);color:var(--mgts-blue)}
.mv .t{flex:1;min-width:0}
.mv .k{display:block;font-size:12px;color:var(--mgts-muted);text-transform:lowercase}
.mv .n{display:block;font-weight:500;line-height:1.25}
.mv .sc{font-family:var(--font-title);font-weight:500;font-size:17px;white-space:nowrap;color:var(--mgts-navy)}
.mv .sc em{font-style:normal;color:var(--mgts-muted);font-size:14px;padding:0 3px}

/* строки-кнопки */
.rows{display:grid;gap:10px}
.hb{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:12px 14px 12px 12px;background:#fff;border-radius:18px;box-shadow:var(--shadow);text-align:left;text-decoration:none;transition:transform .18s var(--ease)}
.hb:active{transform:scale(.98)}
.hb .ic{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--mgts-bg-soft);color:var(--mgts-blue)}
.hb .t{flex:1;min-width:0}
.hb b{display:block;font-weight:500;font-size:16px;line-height:1.2}
.hb small{display:block;font-size:13px;color:var(--mgts-muted);margin-top:2px}
.hb .chev{color:var(--mgts-muted)}

/* советы */
.tips{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 14px;scrollbar-width:none}
.tips::-webkit-scrollbar{display:none}
.tip{flex:0 0 78%;scroll-snap-align:start;background:#fff;border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
@media (min-width:900px){.tips{margin:0;padding:2px 0 14px}.tip{flex:1 1 0}}
.tip .no{font-family:var(--font-title);font-weight:900;font-size:13px;color:var(--mgts-blue);letter-spacing:.06em}
.tip b{font-family:var(--font-title);font-weight:700;font-size:16px;line-height:1.2;color:var(--mgts-navy)}
.tip p{margin:0;font-size:14px;line-height:1.45;color:var(--mgts-navy);opacity:.85}
.why{margin:0 4px 10px;font-size:14px;color:var(--mgts-muted)}

.priv{display:flex;gap:6px;align-items:center;justify-content:center;margin:26px 16px 0;font-size:12px;color:var(--mgts-muted);white-space:nowrap;overflow:hidden}
.priv span{overflow:hidden;text-overflow:ellipsis}
.priv svg{flex:none}
.priv .l{display:none}
@media (min-width:900px){.priv .s{display:none}.priv .l{display:inline}}

/* ---------- шаги ---------- */
.ringcard{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:var(--mgts-bg-soft)}
.ring .fg{stroke:var(--mgts-blue);stroke-linecap:round;transition:stroke-dashoffset .8s var(--ease)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
.ring .c b{font-family:var(--font-title);font-weight:500;font-size:24px;color:var(--mgts-navy)}
.ring .c small{display:block;font-size:12px;color:var(--mgts-muted);margin-top:3px}
.ringcard p{margin:0;font-size:14px;color:var(--mgts-muted)}
.ringcard p b{display:block;font-size:17px;color:var(--mgts-navy);font-weight:500;margin-bottom:2px}
.stg{background:#fff;border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.stg + .stg{margin-top:10px}
.sh{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:0 16px;text-align:left}
.sh b{flex:1;font-family:var(--font-title);font-weight:700;font-size:16px;color:var(--mgts-navy)}
.sh .cnt{font-size:13px;color:var(--mgts-muted);font-weight:500}
.sh .cnt.full{color:#1E8A50}
.sh .chev{color:var(--mgts-muted);transition:transform .3s var(--ease)}
.stg.open .sh .chev{transform:rotate(90deg)}
.fold{display:grid;grid-template-rows:0fr;transition:grid-template-rows .38s var(--ease)}
.open > .fold{grid-template-rows:1fr}
.fold > div{overflow:hidden;min-height:0}
.ck{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;padding:6px 16px;text-align:left;border-top:1px solid #EEF3F9}
.ck .bx{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--mgts-line);display:grid;place-items:center;transition:background .25s var(--ease),border-color .25s}
.ck .bx svg{opacity:0;transform:scale(.4);transition:all .3s var(--ease)}
.ck[aria-checked="true"] .bx{background:var(--mgts-blue);border-color:var(--mgts-blue)}
.ck[aria-checked="true"] .bx svg{opacity:1;transform:none}
.ck[aria-checked="true"] .tt{color:var(--mgts-muted)}
.ck:active .bx{transform:scale(.9)}

.search{position:relative;margin-bottom:12px}
.search input{width:100%;height:48px;border:1.5px solid var(--mgts-line);border-radius:14px;padding:0 14px 0 42px;font-size:16px;background:#fff;outline:none;transition:border-color .2s}
.search input:focus{border-color:var(--mgts-blue)}
.search svg{position:absolute;left:14px;top:14px;color:var(--mgts-muted)}
.memo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:900px){.memo{grid-template-columns:repeat(3,1fr)}}
.mc{background:#fff;border-radius:18px;box-shadow:var(--shadow);text-align:left;display:flex;flex-direction:column;transition:transform .18s var(--ease)}
.mc.open{grid-column:1/-1}
.mc > button{display:flex;flex-direction:column;align-items:flex-start;gap:10px;width:100%;min-height:96px;padding:14px;text-align:left}
.mc.open > button{flex-direction:row;align-items:center;min-height:56px}
.mc .mi{width:40px;height:40px;border-radius:12px;background:var(--mgts-bg-soft);color:var(--mgts-blue);display:grid;place-items:center;flex:none}
.mc b{font-weight:500;font-size:15px;line-height:1.25;color:var(--mgts-navy)}
.mc .fold > div > div{padding:0 16px 16px;font-size:14.5px;line-height:1.5;color:var(--mgts-navy)}
.mc a{display:inline-flex;align-items:center;gap:6px;margin-top:10px;min-height:44px;color:var(--mgts-blue);font-weight:500;text-decoration:none}
.nores{grid-column:1/-1;padding:18px;text-align:center;color:var(--mgts-muted);font-size:14px}

/* ---------- команда ---------- */
.person{display:flex;align-items:center;gap:14px;min-height:64px;padding:10px 16px;border-top:1px solid #EEF3F9}
.person:first-child{border-top:0}
.person .av{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--mgts-bg-soft);color:var(--mgts-blue);font-family:var(--font-title);font-weight:900;font-size:13px}
.person small{display:block;font-size:12.5px;color:var(--mgts-muted)}
.person b{display:block;font-weight:500;line-height:1.25}
.person a{margin-left:auto;color:var(--mgts-blue)}
.list{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.meet{display:flex;gap:14px;align-items:center;padding:14px 16px;border-top:1px solid #EEF3F9}
.meet:first-child{border-top:0}
.meet .dt{flex:none;width:52px;text-align:center;line-height:1.05}
.meet .dt b{display:block;font-family:var(--font-title);font-weight:500;font-size:20px;color:var(--mgts-navy)}
.meet .dt small{font-size:12px;color:var(--mgts-muted)}
.meet .t{flex:1;min-width:0}
.meet .t b{display:block;font-weight:500;line-height:1.25}
.meet .t small{display:block;font-size:13px;color:var(--mgts-muted)}
.meet .btn{min-height:44px;min-width:44px;padding:0 12px;font-size:14px;flex:none}
@media (max-width:419px){.meet .btn .lbl{display:none}}
.empty-s{padding:20px 18px;text-align:center;color:var(--mgts-muted);font-size:14.5px;line-height:1.45}

/* ---------- обратная связь ---------- */
.kd{display:flex;gap:12px;padding:16px;border-top:1px solid #EEF3F9}
.kd:first-child{border-top:0}
.kd .ki{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.kd.kudos .ki{background:rgba(43,174,102,.12);color:#1E8A50}
.kd.grow .ki{background:rgba(0,138,224,.12);color:var(--mgts-blue)}
.kd .t{flex:1;min-width:0}
.kd .meta{font-size:12.5px;color:var(--mgts-muted)}
.kd p{margin:2px 0 0;font-size:15px;line-height:1.45;color:var(--mgts-navy)}
.kd.fresh{animation:fresh 1.6s var(--ease)}
@keyframes fresh{0%{background:rgba(0,138,224,.10)}100%{background:transparent}}
.rq{display:flex;align-items:center;gap:12px;min-height:60px;padding:12px 16px;border-top:1px solid #EEF3F9}
.rq:first-child{border-top:0}
.rq .t{flex:1;min-width:0}
.rq .t b{display:block;font-weight:500}
.rq .t small{display:block;font-size:13px;color:var(--mgts-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chipst{flex:none;font-size:12px;font-weight:500;height:26px;display:inline-flex;align-items:center;padding:0 10px;border-radius:13px;background:var(--mgts-bg-soft);color:var(--mgts-navy)}
.chipst.ok{background:rgba(43,174,102,.12);color:#1E8A50}

/* выбор «Кто ты?» */
.pk{display:flex;align-items:center;gap:14px;min-height:68px;padding:12px 16px;background:#fff;border-radius:18px;box-shadow:var(--shadow);text-decoration:none;transition:transform .18s var(--ease)}
.pk:active{transform:scale(.98)}
.pk .av{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--mgts-bg-soft);color:var(--mgts-blue);font-family:var(--font-title);font-weight:900;font-size:14px}
.pk b{display:block;font-family:var(--font-title);font-weight:700;font-size:17px}
.pk small{display:block;font-size:13px;color:var(--mgts-muted)}
.pk .chev{margin-left:auto;color:var(--mgts-muted)}
.hero.short{padding-bottom:30px;min-height:200px}
.hero.short .hello{max-width:56%}
.hero.short h1{white-space:nowrap}
.hero.short .cube{width:150px;height:150px;top:calc(36px + env(safe-area-inset-top))}

.empty{text-align:center;padding:40px 24px;color:var(--mgts-navy)}
.empty a{display:inline-flex;margin-top:14px;min-height:48px;align-items:center;padding:0 20px;border-radius:14px;background:var(--mgts-blue);color:#fff;text-decoration:none;font-weight:500}
.demo{margin:14px 16px 0;padding:8px 12px;border-radius:12px;background:var(--mgts-blue-soft);font-size:12.5px;color:var(--mgts-navy);text-align:center}

/* ---------- нижний лист ---------- */
.scrim{position:fixed;inset:0;background:rgba(16,44,81,.42);opacity:0;pointer-events:none;transition:opacity .35s var(--ease);z-index:40}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;background:#fff;border-radius:28px 28px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));z-index:41;transform:translateY(105%);transition:transform .42s var(--ease);box-shadow:0 -10px 40px -10px rgba(16,44,81,.3);max-height:92vh;overflow:auto;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
@media (min-width:900px){.sheet{bottom:24px;border-radius:28px;max-width:520px;transform:translateY(calc(100% + 40px))}.sheet.open{transform:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--mgts-line);margin:0 auto 14px}
.sheet h3{margin:0 0 4px;font-size:20px;line-height:1.15;color:var(--mgts-navy);padding-right:44px}
.sheet .sub{font-size:14px;color:var(--mgts-muted);margin:0 0 14px;min-height:20px}
.x{position:absolute;right:12px;top:12px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--mgts-muted);z-index:2}
.x:active{background:var(--mgts-bg-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{min-height:40px;padding:0 14px;border-radius:20px;background:var(--mgts-bg-soft);font-size:14px;color:var(--mgts-navy);transition:background .2s,transform .15s var(--ease);white-space:nowrap}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--mgts-blue-soft)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:14px;background:var(--mgts-bg-soft);margin-bottom:12px}
.seg button{min-height:44px;border-radius:11px;font-weight:500;font-size:15px;color:var(--mgts-navy);transition:background .25s var(--ease),color .25s}
.seg button[aria-checked="true"]{background:#fff;color:var(--mgts-blue);box-shadow:0 1px 3px rgba(19,64,116,.12)}
textarea{width:100%;min-height:110px;resize:none;border:1.5px solid var(--mgts-line);border-radius:16px;padding:14px;font-size:16px;line-height:1.4;outline:none;transition:border-color .2s;background:#fff}
textarea:focus{border-color:var(--mgts-blue)}
textarea::placeholder,input::placeholder{color:var(--mgts-muted)}
.sw{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;margin-top:8px;text-align:left}
.sw .t{flex:1}
.sw b{display:block;font-weight:500}
.sw small{display:block;font-size:13px;color:var(--mgts-muted)}
.tg{flex:none;width:52px;height:32px;border-radius:16px;background:var(--mgts-line);position:relative;transition:background .25s var(--ease)}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .25s var(--ease)}
.sw[aria-checked="true"] .tg{background:var(--mgts-blue)}
.sw[aria-checked="true"] .tg::after{transform:translateX(20px)}
.send{width:100%;min-height:56px;margin-top:10px;border-radius:16px;background:var(--mgts-blue);color:#fff;font-weight:700;font-size:17px;transition:opacity .2s,transform .18s var(--ease)}
.send:active{transform:scale(.98)}
.send:disabled{opacity:.4;cursor:default;transform:none}
.done{text-align:center;padding:18px 0 8px}
.done svg{width:76px;height:76px}
.done circle{stroke-dasharray:220;stroke-dashoffset:220;animation:draw .6s var(--ease) forwards}
.done path{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .4s var(--ease) .45s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.done b{display:block;font-family:var(--font-title);font-weight:900;font-size:22px;color:var(--mgts-navy);margin-top:10px}
.done p{margin:6px 0 0;font-size:14px;color:var(--mgts-muted)}

/* чат с Кубом */
.sheet.chat{height:86vh;display:flex;flex-direction:column;overflow:hidden;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
.sheet.chat #shBody{flex:1;min-height:0;display:flex;flex-direction:column}
.chathead{display:flex;align-items:center;gap:10px;padding-right:44px;margin-bottom:8px}
.chathead b{font-family:var(--font-title);font-weight:900;font-size:18px;color:var(--mgts-navy)}
.chathead small{display:block;font-size:12.5px;color:var(--mgts-muted)}
.msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:8px 2px 12px;overscroll-behavior:contain}
.msg{max-width:86%;padding:11px 14px;border-radius:18px;font-size:15px;line-height:1.45;animation:pop .35s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.msg.bot{align-self:flex-start;background:var(--mgts-bg-soft);color:var(--mgts-navy);border-bottom-left-radius:6px}
.msg.me{align-self:flex-end;background:var(--mgts-blue);color:#fff;border-bottom-right-radius:6px}
.msg b{display:block;margin-bottom:2px}
.msg a{color:var(--mgts-blue);font-weight:500}
.msg .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.msg .acts .btn{background:#fff;min-height:44px}
.msg .acts .btn.pri{background:var(--mgts-blue)}
.subs{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none;flex-shrink:0}
.subs::-webkit-scrollbar{display:none}
.subs .sub{display:inline-flex;align-items:center;gap:6px;flex-shrink:0;min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--mgts-line,#dde3ee);background:#fff;color:var(--mgts-navy);font:500 13px/1 var(--font-text,inherit);cursor:pointer;white-space:nowrap}
.subs .sub.on{background:var(--mgts-navy);border-color:var(--mgts-navy);color:#fff}
.msg .src{display:flex;align-items:center;gap:5px;margin-top:8px;font-size:12px;color:var(--mgts-muted)}
.msg details{margin-top:6px;font-size:12.5px;color:var(--mgts-muted)}
.typing{display:inline-flex;gap:4px;padding:14px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--mgts-muted);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{50%{opacity:.3;transform:translateY(-2px)}}
.qq{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none;flex:none}
.qq::-webkit-scrollbar{display:none}
.ask{display:flex;gap:8px;flex:none}
.ask input{flex:1;min-width:0;height:50px;border:1.5px solid var(--mgts-line);border-radius:16px;padding:0 14px;font-size:16px;outline:none}
.ask input:focus{border-color:var(--mgts-blue)}
.ask button{flex:none;width:50px;height:50px;border-radius:16px;background:var(--mgts-blue);color:#fff;display:grid;place-items:center}
.ask button:disabled{opacity:.4}

.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:var(--mgts-navy-2);color:#fff;font-size:14px;padding:12px 18px;border-radius:14px;z-index:50;transition:all .35s var(--ease);pointer-events:none;max-width:calc(100% - 32px);width:max-content}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:900px){.toast{left:calc(50% + var(--side) / 2);bottom:28px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .rise{opacity:1;transform:none}
  .segs i.on::after{transform:scaleX(1)}
}
/* ---------- широкий экран: две колонки ---------- */
@media (min-width:1100px){
  .wrap[data-tab="home"],.wrap[data-tab="team"],.wrap[data-tab="steps"]{display:grid;grid-template-columns:repeat(2,minmax(0,580px));column-gap:24px;justify-content:center;align-content:start;align-items:start}
  .wrap[data-tab] > *{width:auto;max-width:none;grid-column:1/-1;margin-left:0;margin-right:0}
  .wrap[data-tab="fb"] > *{margin-left:auto;margin-right:auto}
  .wrap[data-tab] > section{margin-left:0!important;margin-right:0!important}
  /* главная: гид | опрос, мой месяц | помощь, полезное на всю ширину */
  .wrap[data-tab="home"] > .guide{grid-column:1;width:auto;margin:-40px 0 0!important;height:calc(100% + 40px)}
  .wrap[data-tab="home"] > .cta{grid-column:2;margin:-40px 0 0!important;position:relative;z-index:3;height:calc(100% + 40px);display:flex;flex-direction:column;justify-content:center}
  .wrap[data-tab="home"] > section:nth-of-type(1){grid-column:1}
  .wrap[data-tab="home"] > section:nth-of-type(2){grid-column:2}
  .wrap[data-tab="home"] .chartbox{height:190px}
  .wrap[data-tab="home"] .tip{flex:1 1 0}
  /* команда: люди | встречи */
  .wrap[data-tab="team"] > section:nth-of-type(1){grid-column:1}
  .wrap[data-tab="team"] > section:nth-of-type(2){grid-column:2;margin-top:28px}
  /* шаги: кольцо и этапы | памятка */
  .wrap[data-tab="steps"] > section:nth-of-type(1),.wrap[data-tab="steps"] > section:nth-of-type(2){grid-column:1}
  .wrap[data-tab="steps"] > section:nth-of-type(3){grid-column:2;grid-row:2 / span 2}
  .wrap[data-tab="steps"] .memo{grid-template-columns:1fr 1fr}
  .wrap[data-tab="fb"] > *{max-width:860px}
  .hero{padding-left:40px;padding-right:40px}
  .hello h1{font-size:46px}
  .cube{width:230px;height:230px;right:40px;top:20px}
}

</style>
</head>
<body>
<nav class="nav" id="nav" hidden aria-label="Разделы"></nav>
<main class="wrap" id="app" aria-live="polite"></main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="grab"></div>
  <button class="x" id="shX" aria-label="Закрыть"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
  <div id="shBody"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
// ---------- адрес API — как в index.html ----------
const qs = new URLSearchParams(location.search);
const API = (() => { let a = qs.get('api'); try { if(a) localStorage.setItem('radar.api', a); else a = localStorage.getItem('radar.api'); } catch {}
  return (a || window.RADAR_API || '').replace(/\/$/, ''); })();
const STATIC_HOST = /vercel\.app$|netlify\.app$|github\.io$/.test(location.hostname) && !API;
const MOCKS = [2,3,4,6];
const IDS = ['СТ-001','СТ-002','СТ-003','СТ-004','СТ-005'];
const TOTAL = 6;
const ID = (qs.get('id') || '').trim().toUpperCase().replace(/^CT/, 'СТ');
const PERIOD = +qs.get('period') || null;
const TABS = [['home','Главная'], ['steps','Шаги'], ['team','Команда'], ['fb','ОС']];
const S = {mock: qs.has('mock') ? (+qs.get('mock') || 6) : (STATIC_HOST ? 6 : null), data:null, ov:null, ver:null, chart:null,
           onb:null, kudos:[], fbreq:[], meet:[], open:null, memoOpen:null, memoQ:'', tab:'home'};
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;

// Общий стор (shared/store.js). Если он не загрузился — тот же интерфейс поверх тех же ключей localStorage, без сети.
const RS = window.RadarStore || (() => {
  console.warn('shared/store.js не загрузился — кабинет работает на локальном хранилище');
  const g = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } };
  const s = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const list = (k, id) => g(k, []).filter(x => x && (!id || x.intern_id === id)).sort((a, b) => String(b.at || b.start || '').localeCompare(String(a.at || a.start || '')));
  const add = (k, r) => { const rec = {id:uid(), at:new Date().toISOString(), ...r}; const a = g(k, []); a.unshift(rec); s(k, a.slice(0, 300)); return rec; };
  return {
    memo: async () => g('radar.memo', null) || fetch('data/onboarding.json', {cache:'no-store'}).then(r => r.json()),
    checklist: id => g('radar.check.' + id, []),
    toggleCheck(id, item){ const d = new Set(g('radar.check.' + id, [])); d.has(item) ? d.delete(item) : d.add(item); const done = [...d]; s('radar.check.' + id, done); return done; },
    kudos: async id => list('radar.kudos', id),
    requestFeedback: async r => add('radar.fbreq', {status:'new', ...r}),
    feedbackRequests: async id => list('radar.fbreq', id),
    meetings: async id => list('radar.meetings', id),
    ics({title, start, minutes = 30, description = '', location = '', attendees = []}){
      const d = new Date(start), e = new Date(d.getTime() + minutes * 60000);
      const f = x => x.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
      const es = v => String(v).replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/[,;]/g, m => '\\' + m);
      return new Blob([['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//MGTS//Radar//RU','METHOD:REQUEST','BEGIN:VEVENT','UID:' + uid() + '@radar.mgts',
        'DTSTAMP:' + f(new Date()),'DTSTART:' + f(d),'DTEND:' + f(e),'SUMMARY:' + es(title),'DESCRIPTION:' + es(description),'LOCATION:' + es(location),
        ...attendees.filter(a => /@/.test(a)).map(a => 'ATTENDEE;ROLE=REQ-PARTICIPANT:mailto:' + a),'END:VEVENT','END:VCALENDAR'].join('\r\n')], {type:'text/calendar;charset=utf-8'});
    },
    download(blob, name){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); },
    onChange(fn){ addEventListener('storage', e => { if(e.key && e.key.startsWith('radar.')) fn(e.key); }); }
  };
})();

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = v => v == null ? '—' : (Math.round(v * 10) / 10).toString().replace('.', ',');
const plural = (n, a, b, c) => { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c; };
const lsGet = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

async function getJSON(url){ const r = await fetch(url, {cache:'no-store'}); if(!r.ok) throw new Error(r.status); return r.json(); }
function mockDir(){ const want = PERIOD || S.mock || 6; return 'mock/p' + (MOCKS.filter(m => m <= want).pop() || MOCKS[0]); }
const pq = () => PERIOD ? `?period=${PERIOD}` : '';
async function load(path, mockFile){
  if(S.mock) return getJSON(`${mockDir()}/${mockFile}`);
  try { return await getJSON(API + path + pq()); }
  catch(e){ S.mock = PERIOD || 6; return getJSON(`${mockDir()}/${mockFile}`); }
}
function clip(d){ if(d && PERIOD) d.periods = (d.periods || []).filter(p => p.period <= PERIOD); return d; }
function link(id){ const u = new URLSearchParams(qs); id ? u.set('id', id) : u.delete('id'); const s = u.toString(); return location.pathname + (s ? '?' + s : ''); }

const SHORT = {'Понятность задач':'Понятность задач','Поддержка и обратная связь наставника':'Поддержка наставника','Комфортность нагрузки':'Комфортность нагрузки',
  'Интерес к задачам':'Интерес к задачам','Профессиональное развитие':'Своё развитие','Взаимодействие с командой':'Команда','Общая удовлетворенность стажировкой':'Стажировка в целом'};
const short = k => SHORT[k] || k;

const TIPS = {
  'Комфортность нагрузки': {about:'про нагрузку', list:[
    ['Как договориться о приоритетах', 'Выпиши все задачи и спроси наставника: что важно на этой неделе? Остальному — дату позже.'],
    ['«Не успеваю» — нормальная фраза', 'Скажи за пару дней до срока, а не в последний вечер. И сразу предложи: перенести или упростить.'],
    ['Полтора часа тишины', 'Один фокус-блок в день на главную задачу. Чаты на беззвучный — мир подождёт.']]},
  'Понятность задач': {about:'про понятность задач', list:[
    ['Перескажи задачу своими словами', '«Я правильно понял, что на выходе нужно…?» — 30 секунд, и половина переделок не случится.'],
    ['Спроси, что значит «готово»', 'Файл, презентация, цифра в отчёте? Когда финиш виден, бежать проще.'],
    ['Покажи черновик пораньше', 'Сырой вариант на 20% поправить легче, чем готовый в пятницу вечером.']]},
  'Поддержка и обратная связь наставника': {about:'про связь с наставником', list:[
    ['15 минут в неделю по расписанию', 'Короткая встреча в календаре надёжнее, чем ловить наставника между созвонами.'],
    ['Копи вопросы списком', 'Заметка в телефоне, пачка вопросов за раз — быстрее для вас обоих.'],
    ['Спроси прямо', '«Что мне сделать иначе в следующей задаче?» Один вопрос — много пользы.']]},
  'Интерес к задачам': {about:'про интерес к задачам', list:[
    ['Скажи, что тебе интересно', 'Задачи часто раздают, просто не зная, кому что нравится. Подскажи наставнику.'],
    ['Узнай, зачем это всё', 'Спроси, кто пользуется результатом твоей работы. Смысл меняет отношение к рутине.'],
    ['Предложи мини-улучшение', 'Есть процесс, который бесит? Набросай, как сделать его проще, — это уже свой проект.']]},
  'Профессиональное развитие': {about:'про развитие', list:[
    ['Одна цель на месяц', 'Выбери навык — SQL, презентации, переговоры — и попроси задачу под него.'],
    ['Записывай, чему научился', 'Две строки по пятницам. К концу стажировки — готовое портфолио.'],
    ['Сходи на чужую встречу', 'Попросись послушать соседнюю команду: увидишь, как всё устроено целиком.']]},
  'Взаимодействие с командой': {about:'про команду', list:[
    ['Обед с коллегой', 'Позови кого-нибудь из команды на обед. После этого просить помощь в разы проще.'],
    ['Карта «кто что знает»', 'Спроси, кто за что отвечает, и запиши. Сэкономит часы поисков.'],
    ['Расскажи, что сделал', 'Минута на планёрке про свою задачу — и тебя знают не только по ID.']]},
  'Общая удовлетворенность стажировкой': {about:'про стажировку в целом', list:[
    ['Что бы ты поменял?', 'Сформулируй одну вещь и напиши HR. Можно анонимно — кнопка выше.'],
    ['Три победы месяца', 'Вспомни, что сейчас умеешь, а месяц назад — нет. Обычно список длиннее, чем кажется.'],
    ['Поговори о том, что дальше', 'Обсуди с наставником планы после стажировки: неопределённость утомляет больше задач.']]},
  _ok: {about:'чтобы держать темп', list:[
    ['Записывай, чему научился', 'Две строки по пятницам. К концу стажировки — готовое портфолио.'],
    ['Попроси задачу на вырост', 'Всё идёт ровно — самое время взять что-то чуть сложнее, чем обычно.'],
    ['Скажи спасибо', 'Отметь коллегу, который помог. Мелочь, а команда запоминает.']]}
};

// ---------- расчёты по своим ответам ----------
function own(d){ return (d.periods || []).filter(p => p.intern && Object.keys(p.intern).length).sort((a, b) => a.period - b.period); }
function avgOf(p){ if(p.intern_avg != null) return p.intern_avg; const v = Object.values(p.intern).filter(x => typeof x === 'number'); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; }
function moves(last, prev){
  if(!last || !prev) return null;
  return Object.keys(last.intern).filter(k => typeof last.intern[k] === 'number' && typeof prev.intern?.[k] === 'number')
    .map(k => ({k, from:prev.intern[k], to:last.intern[k], d:last.intern[k] - prev.intern[k]}));
}
function pickMoves(all){
  const downs = all.filter(m => m.d < 0).sort((a, b) => a.d - b.d), ups = all.filter(m => m.d > 0).sort((a, b) => b.d - a.d);
  const out = [...downs.slice(0, ups.length ? 2 : 3)]; out.push(...ups.slice(0, 3 - out.length)); return out.slice(0, 3);
}
function tipTopic(last, all){
  const worst = (all || []).filter(m => m.d < 0).sort((a, b) => a.d - b.d || a.to - b.to)[0];
  if(worst && TIPS[worst.k]) return {key:worst.k, why:`Потому что «${short(worst.k)}» просела: ${worst.from} → ${worst.to}`};
  if(last){ const low = Object.entries(last.intern).filter(([k, v]) => typeof v === 'number' && v < 4 && TIPS[k]).sort((a, b) => a[1] - b[1])[0];
    if(low) return {key:low[0], why:`Потому что «${short(low[0])}» пока на ${low[1]} из 5`}; }
  return {key:'_ok', why:'Всё ровно — пара идей, как сделать ещё лучше'};
}
// общий контекст для вкладок
function ctx(){
  const d = S.data, mine = own(d), last = mine.at(-1), prev = mine.at(-2);
  const maxP = Math.max(0, ...(d.periods || []).map(p => p.period));
  const cur = PERIOD || S.ov?.current_period || maxP || 1;
  const st = S.ov?.survey_status?.find(s => s.intern_id === d.intern_id)?.periods?.[cur]?.intern;
  const sent = st ?? mine.some(p => p.period === cur);
  const all = moves(last, prev);
  return {d, mine, last, prev, cur, sent, all};
}

// ---------- онбординг: памятка, чек-лист, команда ----------
const memoList = () => (Array.isArray(S.onb) ? S.onb : S.onb?.memo || []).filter(m => m && m.title);
const checkList = () => S.onb?.checklist || [];
function stages(){
  const order = [], by = {};
  checkList().forEach(it => { const s = it.stage || 'Этапы'; if(!by[s]){ by[s] = []; order.push(s); } by[s].push(it); });
  return order.map(s => ({name:s, items:by[s]}));
}
function currentStage(done){ const st = stages(); return (st.find(s => s.items.some(it => !done.includes(it.id))) || st.at(-1))?.name; }

// ---------- фраза Куба по контексту ----------
function guideLine(c){
  const done = RS.checklist(ID), left = checkList().length - checkList().filter(it => done.includes(it.id)).length;
  const load = (c.all || []).find(m => m.k === 'Комфортность нагрузки' && m.d < 0) || (c.last && c.last.intern['Комфортность нагрузки'] <= 2 ? {} : null);
  const worst = (c.all || []).filter(m => m.d <= -1).sort((a, b) => a.d - b.d)[0];
  if(!c.sent) return {t:'Пульс-опрос ждёт тебя, 2 минуты. Ответы видит только HR программы.', act:['Пройти опрос', 'pulse']};
  if(load) return {t:`Нагрузка просела — это частая история на ${c.cur}-м месяце. Скажи наставнику, что важнее, а что подождёт.`, act:['Обсудить с наставником', 'help:mentor']};
  if(worst) return {t:`«${short(worst.k)}» просела. Это не приговор: принеси это на ближайшую встречу 1:1 с наставником.`, act:['Обсудить с наставником', 'help:mentor']};
  if(c.cur <= 1 && done.length < 3) return {t:'Первая неделя — нормально, что всё непонятно. Отметь 3 пункта в «Шагах», и станет проще.', act:['Открыть шаги', 'tab:steps']};
  if(c.cur === 2 || c.cur === 3) return {t:'Скоро промежуточная встреча — вот что спросят: результат задач и твой рост. Загляни в памятку.', act:['Как попасть в штат', 'ask:offer']};
  if(c.cur >= 5 && c.cur <= TOTAL) return {t:'Впереди финальная встреча. Собери 3–4 задачи, которыми гордишься, — это лучший аргумент.', act:['Как попасть в штат', 'ask:offer']};
  if(left > 0 && c.cur <= 3) return {t:`В «Шагах» осталось ${left} ${plural(left, 'пункт', 'пункта', 'пунктов')}. Отмечай по ходу — HR видит прогресс и подскажет, если что-то застряло.`, act:['Открыть шаги', 'tab:steps']};
  return {t:'Всё идёт ровно. Если появится вопрос — спроси меня: отвечу по памятке или передам HR.', act:null};
}

      <div class="memo rise" ${n()} id="memo">${memoHTML(memo)}</div>
    </section>`;

function memoHTML(memo){
  if(!memo.length) return `<div class="nores">Ничего не нашли. Спроси Куба — он передаст вопрос HR.</div>`;

function drawChart(mine, cur, quiet){
  if(!window.Chart || !$('ch')) return;
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const n = Math.max(TOTAL, cur, mine.at(-1)?.period || 0);
  const by = Object.fromEntries(mine.map(p => [p.period, avgOf(p)]));
  const data = Array.from({length:n}, (_, k) => by[k + 1] ?? null);
  const lastIdx = mine.at(-1).period - 1, blue = css('--mgts-blue') || '#008AE0';
  const ctx2 = $('ch').getContext('2d');
  const g = ctx2.createLinearGradient(0, 0, 0, 150); g.addColorStop(0, 'rgba(0,138,224,.20)'); g.addColorStop(1, 'rgba(0,138,224,0)');
  S.chart = new Chart(ctx2, {
    type:'line',
    data:{labels:data.map((_, k) => 'М' + (k + 1)), datasets:[{data, borderColor:blue, backgroundColor:g, fill:true, tension:.35, borderWidth:2.5,
      pointRadius:data.map((_, k) => k === lastIdx ? 6 : 3.5), pointHoverRadius:7,
      pointBackgroundColor:data.map((_, k) => k === lastIdx ? blue : '#fff'), pointBorderColor:blue, pointBorderWidth:2}]},
    options:{responsive:true, maintainAspectRatio:false, animation:(RM || quiet) ? false : {duration:900, easing:'easeOutQuart'},
      layout:{padding:{top:8, right:8, left:2}},
      plugins:{legend:{display:false}, tooltip:{displayColors:false, backgroundColor:css('--mgts-navy-2') || '#102C51', padding:10, cornerRadius:10,
        callbacks:{title:it => 'Месяц ' + (it[0].dataIndex + 1), label:it => fmt(it.parsed.y) + ' из 5'}}},
      scales:{y:{min:1, max:5, ticks:{stepSize:1, color:'#829CB5', font:{family:'MTSText', size:11}}, grid:{color:'#EAF1F8'}, border:{display:false}},
              x:{ticks:{color:'#829CB5', font:{family:'MTSText', size:11}}, grid:{display:false}, border:{display:false}}}}
  });
}

// обращение стажёра: API, иначе localStorage 'radar.intern-requests' (у каждой записи есть id)
async function postRequest(body){
  try {
    if(S.mock) throw new Error('mock');
    const r = await fetch(API + '/api/intern-requests', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    if(!r.ok) throw new Error(r.status);
    return 'server';
  } catch(e){
    const k = 'radar.intern-requests', all = lsGet(k, []);
    all.push({id:Date.now().toString(36) + Math.random().toString(36).slice(2, 5), ...body, at:new Date().toISOString()});
    lsSet(k, all.slice(-50)); return 'local';
  }
}

const kubeApi = () => (S.mock || STATIC_HOST) ? null : (API || location.origin);
const histKey = sub => `radar.kube.${ID || 'anon'}.${sub}`;
function hist(sub){

  return S.hists[sub];
}
function pushHist(sub, who, html){

      body:JSON.stringify({intern_id:ID || null, topic:sub, who, text:d.textContent.replace(/\s+/g, ' ').trim().slice(0, 1500)})}).catch(() => {});
  }
}
async function openChat(sub){

  const main = g.id === 'main';
  openSheet(`<div class="chathead"><span class="ava"><img src="brand/img/cube.png" alt=""></span><span><b id="shT">${main ? 'Куб' : esc(g.title)}</b><small>${main ? 'Отвечаю по памятке и правилам программы. Твоих оценок не вижу' : 'Куб · подчат по теме'}</small></span></div>
    <nav class="subs" id="subs" aria-label="Темы чата">${S.groups.map(x => `<button class="sub${x.id === g.id ? ' on' : ''}" data-sub="${x.id}" aria-current="${x.id === g.id}">${ic(x.icon || 'chat', 15, 2)}<span>${esc(x.title)}</span></button>`).join('')}</nav>
    <div class="msgs" id="msgs"></div>

    <form class="ask" id="askf"><label class="sr" for="askq">Вопрос Кубу</label><input id="askq" placeholder="${main ? 'Спроси что угодно' : 'Вопрос по теме «' + esc(g.title) + '»'}" autocomplete="off" enterkeyhint="send">
      <button id="askgo" type="submit" aria-label="Отправить" disabled>${ic('send', 20, 2)}</button></form>`, 'chat');
  $('sheet').setAttribute('aria-labelledby', 'shT');
  $('subs').querySelectorAll('[data-sub]').forEach(b => b.onclick = () => openChat(b.dataset.sub));
  $('subs').querySelector('.on')?.scrollIntoView({inline:'center', block:'nearest'});
  let h = hist(g.id);
  const api = kubeApi();
  if(!h.length && api){  // другое устройство: подтянуть историю подчата с бэка
    try {
      const r = await fetch(`${api}/api/intern-chat/history?intern_id=${encodeURIComponent(ID || '')}&topic=${encodeURIComponent(g.id)}`);
      const rows = r.ok ? await r.json() : [];
      if(Array.isArray(rows) && rows.length && S.sub === g.id && !hist(g.id).length){
        S.hists[g.id] = rows.slice(-40).map(x => ({who:x.who === 'me' ? 'me' : 'bot', html:esc(x.text || '')})); h = S.hists[g.id];
        try { localStorage.setItem(histKey(g.id), JSON.stringify(h)); } catch {}
      }
    } catch {}
  }
  if(!$('msgs')) return;
  if(!h.length){
    const tops = main ? `<div class="acts">${S.groups.filter(x => x.id !== 'main').map(x => `<button class="btn" data-go-sub="${x.id}">${esc(x.title)}</button>`).join('')}</div>` : '';
    bot(main ? `Привет! Я Куб, гид по стажировке. Спроси что угодно или выбери тему:${tops}` : `${esc(g.hint || '')} Выбери вопрос ниже или напиши свой.`, g.id);
  } else h.forEach(x => addMsg(x.who, x.html, false));
  $('qq').querySelectorAll('[data-q]').forEach(b => b.onclick = () => ask(b.textContent));
  const inp = $('askq'); inp.oninput = () => { $('askgo').disabled = !inp.value.trim(); };
  $('askf').onsubmit = e => { e.preventDefault(); const q = inp.value.trim(); if(!q) return; inp.value = ''; $('askgo').disabled = true; ask(q); };
}
function addMsg(who, html, save = true, sub = S.sub){
  if(save) pushHist(sub, who, html);
  const box = $('msgs'); if(!box || sub !== S.sub) return;
  const el = document.createElement('div'); el.className = 'msg ' + who; el.innerHTML = html; box.appendChild(el);
  bindMsg(el); box.scrollTop = box.scrollHeight;
}
function bindMsg(el){
  el.querySelectorAll('[data-assistant-question]').forEach(b => b.onclick = () => ask(b.dataset.assistantQuestion));
  el.querySelectorAll('[data-draft]').forEach(b => b.onclick = async () => {
    try {
      await navigator.clipboard.writeText(b.dataset.draft);
      toast('Черновик скопирован');
    } catch {
      toast('Выдели текст и скопируй вручную');
    }
  });
  el.querySelectorAll('[data-help]').forEach(b => b.onclick = () => openHelp(b.dataset.help));
  el.querySelectorAll('[data-cube-act]').forEach(b => b.onclick = () => act(b.dataset.cubeAct));
  el.querySelectorAll('[data-go-sub]').forEach(b => b.onclick = () => openChat(b.dataset.goSub));
  el.querySelectorAll('[data-relay]').forEach(b => b.onclick = async () => {
    b.disabled = true; const where = await postRequest({intern_id:ID || null, type:'question', text:b.dataset.relay, anonymous:false});
    bot(`Передал ✓ HR ответит лично.${where === 'local' ? ' (Демо: вопрос сохранён на этом устройстве.)' : ''}`);
  });
}
function bot(html, sub = S.sub){
  const live = () => $('msgs') && $('sheet').classList.contains('open') && sub === S.sub;
  if(!live()){ pushHist(sub, 'bot', html); return; }
  if(RM || !hist(sub).length){ addMsg('bot', html, true, sub); return; }
  // ответы по очереди, даже если спросили два раза подряд
  S.botQ = (S.botQ || Promise.resolve()).then(() => new Promise(res => {
    if(!live()){ pushHist(sub, 'bot', html); return res(); }
    const bx = $('msgs'), ty = document.createElement('div'); ty.className = 'msg bot typing'; ty.innerHTML = '<i></i><i></i><i></i>'; bx.appendChild(ty); bx.scrollTop = bx.scrollHeight;
    setTimeout(() => { ty.remove(); if(live()) addMsg('bot', html, true, sub); else pushHist(sub, 'bot', html); res(); }, 550);
  }));
}
function relayQuestion(q){
  return `<div class="acts"><button class="btn pri" data-relay="${esc(q)}">Передать HR</button></div>`;
}
// источник ответа Куба: «Из памятки: Пропуск»
const SRC_KIND = {'Памятка':'Из памятки', 'Чек-лист':'Из чек-листа', 'Кабинет стажёра':'Из подсказок кабинета', 'Куб':'Из памятки',
  'Условия кейса МГТС':'Из условий программы', 'Структура пульс-опроса':'Из правил пульс-опроса'};
const CUBE_ACT = {hr:['help:hr', 'Написать HR'], anonymous:['help:anonymous', 'Анонимно'], mentor:['help:mentor', 'Обсудить с наставником'], fbreq:['fbreq', 'Попросить ОС']};
const srcLine = (kind, title, extra = '') => `<small class="src">${ic('info', 13, 2)} ${esc(SRC_KIND[kind] || ('Источник: ' + kind))}: «${esc(title)}»${extra}</small>`;
function memoAnswer(m){
  return `<b>${esc(m.title)}</b>${esc(m.text)}${m.link ? `<br><a href="${esc(m.link)}" target="_blank" rel="noopener">${esc(m.link_label || 'Подробнее')}</a>` : ''}${srcLine('Памятка', m.title)}`;
}
function assistantAnswer(r, sub = 'main'){
  const d = r.doc;
  const link = d.link || d.url ? `<br><a href="${esc(d.link || d.url)}" target="_blank" rel="noopener">${esc(d.link_label || (d.url ? 'Открыть источник' : 'Подробнее'))}</a>` : '';
  const orig = r.engine ? `<details><summary>Фрагмент источника</summary>${esc(d.text)}</details>` : '';
  const draft = r.draft ? `<br><i>${esc(r.draft)}</i><div class="acts"><button class="btn" data-draft="${esc(r.draft)}">Скопировать черновик</button></div>` : '';
  const acts = (r.actions || []).map(a => CUBE_ACT[a]).filter(Boolean).map(([a, t], i) => `<button class="btn${i ? '' : ' pri'}" data-cube-act="${a}">${t}</button>`);
  const sugg = (r.suggestions || []).map(t => `<button class="btn" data-assistant-question="${esc(t)}">${esc(t)}</button>`);
  const g = sub === 'main' && d.group && S.groups?.find(x => x.id === d.group);
  const go = g ? [`<button class="btn" data-go-sub="${g.id}">${ic(g.icon || 'chat', 15, 2)} Ещё по теме: ${esc(g.title)}</button>`] : [];
  const all = [...acts, ...sugg, ...go];
  return `${esc(r.answer)}${link}${draft}${all.length ? `<div class="acts">${all.join('')}</div>` : ''}` +
    srcLine(d.source, d.title, r.engine ? ' · сформулировал ИИ' : '') + orig;
}
function unknownAnswer(r){
  const what = r.unknown?.length ? ` (не нашёл: «${esc(r.unknown.join('», «'))}»)` : '';
  return `Честно: в памятке и правилах программы ответа нет${what}, а гадать не буду. Лучше спросить HR — ответят лично.
    <div class="acts"><button class="btn pri" data-relay="${esc(r.question)}">Передать вопрос HR</button><button class="btn" data-help="hr">Написать HR</button></div>`;
}
function ask(q, hit){
  const sub = S.sub || 'main';
  addMsg('me', esc(q), true, sub);
  S.assistantQueue = (S.assistantQueue || Promise.resolve()).then(() => replyToQuestion(q, hit, sub));
}
async function replyToQuestion(q, hit, sub = 'main'){
  if(hit){ S.assistantTopic = null; return bot(memoAnswer(hit), sub); }
  // Кубу — только памятка, отдел и ID наставника. Оценки и сигналы HR не передаём.
  const ctx = {onb:S.onb, department:S.data?.department, mentor_id:S.data?.mentor_id, topic:sub, api:kubeApi()};
  let result;
  try { result = await InternAssistant.ask(q, S.assistantTopic, ctx); } catch {}
  if(!result){ bot(`Не смог открыть памятку. Напиши HR, ответят лично.<div class="acts"><button class="btn pri" data-help="hr">Написать HR</button></div>`, sub); return; }
  S.assistantTopic = result.topic;
  for(const reply of result.replies) bot(reply.status === 'answered' ? assistantAnswer(reply, sub) : unknownAnswer(reply), sub);
}

$('shX').onclick = closeSheet;
$('scrim').onclick = closeSheet;
addEventListener('keydown', e => { if(e.key === 'Escape') closeSheet(); });
(() => { const sh = $('sheet'); let y0 = null, dy = 0;
  sh.addEventListener('touchstart', e => { if(sh.scrollTop > 0 || e.target.closest('textarea,input,.msgs,.qq,.chips')) return; y0 = e.touches[0].clientY; dy = 0; sh.style.transition = 'none'; }, {passive:true});
  sh.addEventListener('touchmove', e => { if(y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = `translateY(${dy}px)`; }, {passive:true});
  sh.addEventListener('touchend', () => { if(y0 == null) return; sh.style.transition = ''; y0 = null; if(dy > 90) closeSheet(); else sh.style.transform = ''; });
})();
let toastT;
function toast(t){ const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2600); }

// ---------- загрузка ----------
async function loadAll(){
  const d = clip(await load(`/api/interns/${encodeURIComponent(ID)}`, `intern_${ID}.json`));
  let ov = null; try { ov = await load('/api/overview', 'overview.json'); } catch {}
  S.data = d; S.ov = ov;
}
async function loadOnb(){ try { S.onb = await RS.memo(); } catch { S.onb = S.onb || {}; } }
async function loadLists(){
  const safe = p => Promise.resolve().then(p).catch(() => []);
  const [k, f, m] = await Promise.all([safe(() => RS.kudos(ID)), safe(() => RS.feedbackRequests(ID)), safe(() => RS.meetings(ID))]);
  S.kudos = k || []; S.fbreq = f || []; S.meet = m || [];
}
async function poll(){
  if(S.mock || document.hidden) return;
  try {
    const v = await getJSON(API + '/api/version');
    if(S.ver != null && v.version !== S.ver){ await loadAll(); if(S.tab === 'home') render(true); if(v.last_event?.intern_id === ID) toast('Твои данные обновились'); }
    S.ver = v.version;
  } catch {}
}
function tabFromHash(){ const h = location.hash.slice(1); return TABS.some(t => t[0] === h) ? h : 'home'; }
(async function init(){
  if(!ID){ renderPick(); return; }
  try { await Promise.all([loadAll(), loadOnb(), loadLists()]); }
  catch(e){
    $('app').classList.add('nonav');
    $('app').innerHTML = `<div class="empty"><h2>Не нашли ${esc(ID)}</h2><p>Проверь ID или выбери себя из списка.</p><a href="${esc(link(null))}">Кто ты?</a></div>`;
    return;
  }
  S.tab = tabFromHash();
  render(false);
  addEventListener('hashchange', () => { S.tab = tabFromHash(); closeSheet(); render(false); scrollTo({top:0}); });
  // HR поменял что-то в соседней вкладке → перерисовать
  RS.onChange(async key => {
    const before = new Set(S.kudos.map(k => k.id));
    if(/memo/.test(key)) await loadOnb();
    await loadLists();
    const nw = S.kudos.filter(k => !before.has(k.id));
    S.fresh = new Set(nw.map(k => k.id));
    if(!$('sheet').classList.contains('open')) render(true); else renderNav();
    if(nw.length) toast(nw[0].kind === 'grow' ? `Новая обратная связь от ${nw[0].role || 'команды'}` : `Тебя похвалили: ${nw[0].role || 'команда'} ✓`);
    else if(/meetings/.test(key)) toast('Новая встреча в «Команде»');
  });
  if(!S.mock){ poll(); setInterval(poll, 4000); }
})();
</script>
